    function deleteDraftEdge(index) {
        if (index < 0 || index >= draftEdges.length) return;
        draftEdges.splice(index, 1);
        setEdgeEditorStatus('edgeStatusDeleted');
        drawMap();
    }

    function updateDraftEdgeType(index, edgeType) {
        if (index < 0 || index >= draftEdges.length) return;
        if (!CAMPUS_EDGE_TYPES.includes(edgeType)) {
            setEdgeEditorStatus('edgeStatusInvalidType');
            renderEdgeEditor();
            return;
        }
        draftEdges[index][2] = edgeType;
        setEdgeEditorStatus('edgeStatusTypeUpdated');
        drawMap();
    }

    function validateAllDraftEdges(options = {}) {
        const seen = new Set(edgesData.map(edge => getEdgeKey(edge.from, edge.to)));
        for (const edge of draftEdges) {
            const [source, target, type] = edge;
            const result = validateDraftEdge(source, target, type, { skipDraft: true, allowUnknownType: options.allowUnknownType });
            if (!result.ok) return result;
            const key = getEdgeKey(source, target);
            if (seen.has(key)) return { ok: false, messageKey: 'edgeStatusDuplicate' };
            seen.add(key);
        }
        return { ok: true };
    }

    function normalizeImportedDraftEdge(edge) {
        if (Array.isArray(edge) && edge.length >= 3) {
            return [String(edge[0]), String(edge[1]), String(edge[2])];
        }
        if (edge && typeof edge === 'object') {
            const source = edge.source || edge.from;
            const target = edge.target || edge.to;
            if (source && target && edge.type) return [String(source), String(target), String(edge.type)];
        }
        return null;
    }

    function extractDraftEdgesFromImport(payload) {
        if (Array.isArray(payload)) return payload.map(normalizeImportedDraftEdge).filter(Boolean);
        if (!payload || typeof payload !== 'object') return [];
        const preferred = payload["校園動線 Draft"] || payload.campus_edges || payload.campus_edges_draft || payload.draftEdges || payload.edges;
        if (Array.isArray(preferred)) return preferred.map(normalizeImportedDraftEdge).filter(Boolean);
        return Object.values(payload)
            .filter(Array.isArray)
            .flatMap(edges => edges.map(normalizeImportedDraftEdge).filter(Boolean));
    }

    async function importDraftEdges(file) {
        if (!file) return;
        let importedEdges = [];
        try {
            const payload = JSON.parse(await file.text());
            importedEdges = extractDraftEdgesFromImport(payload);
        } catch (error) {
            setEdgeEditorStatus('edgeStatusImportInvalid');
            return;
        }
        if (!importedEdges.length) {
            setEdgeEditorStatus('edgeStatusImportEmpty');
            return;
        }
        const previousDraftEdges = draftEdges;
        draftEdges = [...draftEdges, ...importedEdges];
        const result = validateAllDraftEdges({ allowUnknownType: true });
        if (!result.ok) {
            draftEdges = previousDraftEdges;
            setEdgeEditorStatus(result.messageKey);
            drawMap();
            return;
        }
        edgeEditorSourceId = null;
        const hasUnknownType = importedEdges.some(edge => !CAMPUS_EDGE_TYPES.includes(edge[2]));
        setEdgeEditorStatus(hasUnknownType ? 'edgeStatusImportedWithInvalidType' : 'edgeStatusImported', { count: importedEdges.length });
        drawMap();
    }

    function exportDraftEdges() {
        if (!draftEdges.length) {
            setEdgeEditorStatus('edgeStatusExportEmpty');
            return;
        }
        const result = validateAllDraftEdges();
        if (!result.ok) {
            setEdgeEditorStatus(result.messageKey);
            return;
        }
        const payload = {
            "校園動線 Draft": draftEdges.map(edge => [edge[0], edge[1], edge[2]])
        };
        const blob = new Blob([JSON.stringify(payload, null, 2) + '\n'], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'campus_edges.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setEdgeEditorStatus('edgeStatusExported');
    }

    function generateGroupedFloorCheckboxes() {
        floorCheckboxesContainer.innerHTML = '';
        const bldgGroups = { "T4": [], "T1": [], "RB": [], "RB-STACK": [], "AU": [] };
        [...nodesData, ...poisData].forEach(n => {
            if (n.building && bldgGroups[n.building.toUpperCase()] !== undefined) {
                if (!bldgGroups[n.building.toUpperCase()].includes(n.floor_name)) bldgGroups[n.building.toUpperCase()].push(n.floor_name);
            }
        });

        for (const [bldg, floors] of Object.entries(bldgGroups)) {
            if (floors.length === 0) continue;
            floors.sort((a, b) => {
                let vA = a.startsWith('B') ? -parseInt(a.substring(1)) : parseFloat(a);
                let vB = b.startsWith('B') ? -parseInt(b.substring(1)) : parseFloat(b);
                return vB - vA;
            });
            const groupDiv = document.createElement('div');
            groupDiv.innerHTML = `<div class="bldg-group-title" data-bldg="${bldg}">${bldg} ${t('buildingSuffix')}</div>`;
            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'bldg-group-items';

            floors.forEach(f => {
                const groupKey = `${bldg}-${f}`; active3DCheckboxes.add(groupKey);
                const itemDiv = document.createElement('div'); itemDiv.className = 'floor-checkbox-item';
                itemDiv.innerHTML = `<input type="checkbox" value="${groupKey}" checked> <span>${f}F</span>`;
                itemDiv.querySelector('input').addEventListener('change', (e) => {
                    e.target.checked ? active3DCheckboxes.add(groupKey) : active3DCheckboxes.delete(groupKey);
                    drawMap();
                });
                itemsContainer.appendChild(itemDiv);
            });
            groupDiv.appendChild(itemsContainer); floorCheckboxesContainer.appendChild(groupDiv);
        }
    }

    function isNodeVisible(node) {
        if (!node) return false;
        if (isCampusMode()) return isCampusNode(node);
        if (isCampusNode(node)) return false;
        let isActiveByFilter = currentBuildingFilter === 'General' || node.building === currentBuildingFilter || (currentBuildingFilter === 'RB' && node.building === 'RB-STACK');
        if (!isActiveByFilter) return true;

        if (is3DMode) return active3DCheckboxes.has(`${node.building}-${node.floor_name}`);
        if (currentPath.includes(node.id) || altPath.includes(node.id)) return true;
        return Math.abs(node.z - currentElevation) <= 200;
    }

    function findClosestNodeAt(maxDistance, includePois = true) {
        let closestNode = null, minDist = Infinity;
        const candidates = includePois ? [...nodesData, ...poisData] : nodesData;
        candidates.filter(n => isNodeVisible(n) && isNodeDrawableForMode(n)).forEach(node => {
            let p = getProjectedCoords(node);
            const dist = Math.sqrt((p.x - mouseX)**2 + (p.y - mouseY)**2);
            if (dist < maxDistance && dist < minDist) {
                minDist = dist;
                closestNode = node;
            }
        });
        return closestNode;
    }

    const COS_ISO = Math.cos(Math.PI / 6), SIN_ISO = Math.sin(Math.PI / 6);

    function getProjectedCoords(node, customZ, customZoom = mapZoom, customOffsetX = mapOffsetX, customOffsetY = mapOffsetY, isMinimap = false) {
        if (!node) return {x: 0, y: 0};
        // 🌟 配合 Minimap 放大，中心點微調
        const cx = isMinimap ? 230 : 700;
        const cy = isMinimap ? 200 : 450;
        const rot = isMinimap ? 0 : mapRotation;
        const force3D = isMinimap ? true : is3DMode;

        const rx = (node.x - 500) * Math.cos(rot) - (node.y - 500) * Math.sin(rot);
        const ry = (node.x - 500) * Math.sin(rot) + (node.y - 500) * Math.cos(rot);
        let outX, outY;
        if (force3D) {
            let actualZ = customZ !== undefined ? customZ : node.z;
            outX = cx + (rx - ry) * COS_ISO;
            outY = cy + (rx + ry) * SIN_ISO - (actualZ * zScale) + (isMinimap ? 130 : 150);
        } else {
            outX = cx + rx; outY = cy + ry;
        }
        return { x: cx + (outX - cx) * customZoom + customOffsetX, y: cy + (outY - cy) * customZoom + customOffsetY };
    }

    function drawStartEndCapsule(ctx, text, x, y, bgColor, textColor = 'white', strokeColor = 'white') {
        ctx.font = `bold ${Math.max(14, 14 * mapZoom)}px sans-serif`;
        const metrics = ctx.measureText(text);
        const padX = 14 * mapZoom, h = 30 * mapZoom, r = 6 * mapZoom;
        const w = metrics.width + padX * 2;

        ctx.fillStyle = bgColor; ctx.strokeStyle = strokeColor; ctx.lineWidth = 2.0 * mapZoom;

        ctx.beginPath();
        ctx.moveTo(x + r, y - h/2); ctx.lineTo(x + w - r, y - h/2); ctx.arcTo(x + w, y - h/2, x + w, y + h/2, r);
        ctx.lineTo(x + w, y + h/2 - r); ctx.arcTo(x + w, y + h/2, x + w - r, y + h/2, r);
        ctx.lineTo(x + r, y + h/2); ctx.arcTo(x, y + h/2, x, y + h/2 - r, r);
        ctx.lineTo(x, y - h/2 + r); ctx.arcTo(x, y - h/2, x + r, y - h/2, r); ctx.closePath();
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = textColor; ctx.fillText(text, x + padX, y + 5 * mapZoom);
    }

    function estimateWalkingMinutes(distanceMeters) {
        const distance = Number(distanceMeters);
        if (!Number.isFinite(distance) || distance <= 0) return null;
        return Math.max(1, Math.ceil(distance / WALKING_METERS_PER_MIN));
    }

    function getRouteEtaText(distanceMeters) {
        const minutes = estimateWalkingMinutes(distanceMeters);
        if (!minutes) return '';
        return t('routeEta').replace('{minutes}', minutes);
    }

    function updateRouteSummary() {
        const eta = getRouteEtaText(currentRouteDistance);
        if (!currentPath.length || !eta) {
            routeSummary.style.display = 'none';
            return;
        }

        routeSummary.style.display = 'flex';
        routeSummaryMode.textContent = getRouteModeLabel(currentRouteMode);
        routeSummaryMain.textContent = eta;
        routeSummarySub.textContent = t('routeSummaryDistance').replace('{distance}', currentRouteDistance);
    }

    function drawDynamicCapsule(ctx, lines, cx, cy, bgColor, textColor, isHovered) {
        const showDetails = isHovered;
        const displayLines = showDetails ? lines : [lines[0]];
        const titleSize = Math.max(showDetails ? 18 : 14, (showDetails ? 24 : 18) * mapZoom);
        const bodySize = Math.max(12, 18 * mapZoom);
        const titleFont = `900 ${titleSize}px 'Segoe UI', sans-serif`;
        const bodyFont = `bold ${bodySize}px 'Segoe UI', sans-serif`;
        const lineHeight = showDetails ? Math.max(bodySize + 8, 32 * mapZoom) : Math.max(titleSize + 8, 24 * mapZoom);

        ctx.font = titleFont;
        let maxW = 0;
        displayLines.forEach((l, i) => { ctx.font = i === 0 ? titleFont : bodyFont; let w = ctx.measureText(l).width; if(w > maxW) maxW = w; });

        const padX = Math.max(12, (showDetails ? 30 : 20) * mapZoom);
        const padY = Math.max(8, (showDetails ? 24 : 14) * mapZoom);
        const w = maxW + padX * 2, h = displayLines.length * lineHeight + (showDetails ? padY * 1.2 : padY * 0.8), r = showDetails ? Math.max(12, 24 * mapZoom) : h / 2;
        let x = cx - w / 2, y = cy - h;

        ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 25; ctx.shadowOffsetY = 8;
        ctx.fillStyle = bgColor;

        ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2.5 * mapZoom; ctx.stroke();
        ctx.shadowColor = 'transparent';

        displayLines.forEach((l, i) => {
            if (i === 0) {
                ctx.fillStyle = textColor; ctx.font = titleFont;
                let textYOffset = showDetails ? (8 * mapZoom) : (h - lineHeight)/2 + 2 * mapZoom;
                ctx.fillText(l, x + padX, y + padY + i * lineHeight + textYOffset);
                if (displayLines.length > 1) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(x + padX, y + padY + i * lineHeight + 22 * mapZoom, maxW, 2 * mapZoom); }
            } else {
                ctx.fillStyle = '#475569'; ctx.font = bodyFont;
                ctx.fillText(l, x + padX, y + padY + i * lineHeight + Math.max(11, 16 * mapZoom));
            }
        });
    }

    // 🌟 Item 4: 放大版 Minimap，非關聯樓板極度透明 (5%)，並標示關聯樓層
    function drawMinimap() {
        minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
        // 為了將所有建築容納進去，縮小內部畫布的 Zoom
        let mZoom = 0.22, mOffsetX = 0, mOffsetY = 0;

        const slabsToDraw = [];
        for (let bldg in BUILDING_HEIGHTS) {
            for (let f in BUILDING_HEIGHTS[bldg]) {
                if (BLDG_SHAPES[bldg]) slabsToDraw.push({b: bldg, f: f, z: BUILDING_HEIGHTS[bldg][f], path: BLDG_SHAPES[bldg]});
            }
        }
        slabsToDraw.sort((a, b) => a.z - b.z);

        const BLDG_COLORS = { "RB": 'rgba(173, 216, 230, 0.45)', "RB-STACK": 'rgba(173, 216, 230, 0.35)', "T4": 'rgba(144, 238, 144, 0.45)', "T1": 'rgba(255, 235, 153, 0.45)', "AU": 'rgba(251, 146, 60, 0.55)' };

        slabsToDraw.forEach(slab => {
            let isRelated = Math.abs(slab.z - currentElevation) <= 200;

            // 只有相關樓板顯示顏色，無關樓板顯示 5% 透明度的白色 (rgba 255,255,255,0.05)
            minimapCtx.fillStyle = isRelated ? (BLDG_COLORS[slab.b] || '#cbd5e1') : 'rgba(255, 255, 255, 0.05)';

            minimapCtx.beginPath();
            let minX = Infinity; let leftMostPt = null;
            slab.path.forEach((pt, i) => {
                let proj = getProjectedCoords({x: pt[0], y: pt[1]}, slab.z, mZoom, mOffsetX, mOffsetY, true);
                if (proj.x < minX) { minX = proj.x; leftMostPt = proj; }
                i === 0 ? minimapCtx.moveTo(proj.x, proj.y) : minimapCtx.lineTo(proj.x, proj.y);
            });
            minimapCtx.closePath(); minimapCtx.fill();

            // 邊框也配合：相關樓板明顯白色邊框，無關樓板非常淡的灰色邊框以防完全隱形
            minimapCtx.strokeStyle = isRelated ? 'rgba(255,255,255,0.9)' : 'rgba(150,150,150,0.1)';
            minimapCtx.lineWidth = 1; minimapCtx.stroke();

            // 只有「相關的基準樓板」才顯示 1F, 2F 的文字
            if (leftMostPt && isRelated) {
                minimapCtx.fillStyle = 'rgba(71, 85, 105, 0.95)';
                minimapCtx.font = "bold 13px Arial";
                minimapCtx.textAlign = "right";
                minimapCtx.fillText(`${slab.f}F`, leftMostPt.x - 6, leftMostPt.y);
                minimapCtx.textAlign = "left";
            }
        });
    }

    function updateHUD() {
        let actualAngle = (mapRotation * 180 / Math.PI) - MAP_TOP_BEARING_DEG;
        document.getElementById('compass-needle').style.transform = `rotate(${actualAngle}deg)`;

        const scaleBarPixels = 100;
        let realMeters = (scaleBarPixels / mapZoom) * METERS_PER_MAP_UNIT;

        let displayMeters;
        if (realMeters < 1) displayMeters = (realMeters * 100).toFixed(0) + " cm";
        else if (realMeters > 50) displayMeters = (realMeters).toFixed(0) + " m";
        else displayMeters = (realMeters).toFixed(1) + " m";

        document.getElementById('scale-text').innerText = displayMeters;
    }

    function getFeatureCentroid(points) {
        if (!points || points.length === 0) return null;
        let area = 0, cx = 0, cy = 0;
        for (let i = 0; i < points.length; i++) {
            const p1 = points[i], p2 = points[(i + 1) % points.length];
            const cross = p1[0] * p2[1] - p2[0] * p1[1];
            area += cross;
            cx += (p1[0] + p2[0]) * cross;
            cy += (p1[1] + p2[1]) * cross;
        }
        area *= 0.5;
        if (Math.abs(area) < 0.0001) {
            const sum = points.reduce((acc, p) => ({x: acc.x + p[0], y: acc.y + p[1]}), {x: 0, y: 0});
            return {x: sum.x / points.length, y: sum.y / points.length};
        }
        return {x: cx / (6 * area), y: cy / (6 * area)};
    }

    function isLawnFeature(feature) {
        const name = `${feature.name || feature.label || feature.id || ''}`.toLowerCase();
        return name.startsWith('lawn-') || name.startsWith('court-') || name === 'lawn';
    }

    function isWhiteOutdoorFeature(feature) {
        const name = `${feature.name || feature.label || feature.id || ''}`.toLowerCase();
        return name === 'athletic-field';
    }

    function getCampusFeatureHeight(feature) {
        const massing = feature.massing || {};
        const heightZ = Number(massing.height_z);
        if (Number.isFinite(heightZ) && heightZ > 0) return heightZ;
        const heightM = Number(massing.height_m);
        return Number.isFinite(heightM) && heightM > 0 ? heightM * 100 : 0;
    }

    function getCampusFeatureStyle(feature) {
        if (feature.category === 'outdoor') {
            if (isWhiteOutdoorFeature(feature)) {
                return {
                    fill: feature.fill || 'rgba(255, 255, 255, 0.34)',
                    stroke: feature.stroke || 'rgba(203, 213, 225, 0.48)',
                    labelFill: feature.label_fill || 'rgba(71, 85, 105, 0.76)'
                };
            }
            if (isLawnFeature(feature)) {
                return {
                    fill: feature.fill || 'rgba(187, 247, 208, 0.20)',
                    stroke: feature.stroke || 'rgba(74, 222, 128, 0.22)',
                    labelFill: feature.label_fill || 'rgba(22, 101, 52, 0.56)'
                };
            }
            return {
                fill: feature.fill || 'rgba(186, 230, 253, 0.26)',
                stroke: feature.stroke || 'rgba(56, 189, 248, 0.28)',
                labelFill: feature.label_fill || 'rgba(3, 105, 161, 0.60)'
            };
        }
        return {
            fill: feature.fill || 'rgba(255, 255, 255, 0.34)',
            stroke: feature.stroke || 'rgba(203, 213, 225, 0.48)',
            labelFill: feature.label_fill || 'rgba(71, 85, 105, 0.76)'
        };
    }

    function projectFeaturePath(points, z) {
        return points.map(pt => getProjectedCoords({x: pt[0], y: pt[1]}, z));
    }

    function traceProjectedPath(projectedPoints) {
        projectedPoints.forEach((pt, idx) => {
            idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
        });
        ctx.closePath();
    }

    function drawCampusFootprint(feature, points, style) {
        ctx.beginPath();
        traceProjectedPath(projectFeaturePath(points, 0));
        ctx.fillStyle = style.fill;
        ctx.fill();
        ctx.strokeStyle = style.stroke;
        ctx.lineWidth = Math.max(0.7, 1.2 * mapZoom);
        ctx.stroke();
    }

    function drawCampusMassing(feature, points, style) {
        const heightZ = getCampusFeatureHeight(feature);
        if (!is3DMode || feature.category !== 'building' || heightZ <= 0) {
            drawCampusFootprint(feature, points, style);
            return;
        }

        const base = projectFeaturePath(points, 0);
        const top = projectFeaturePath(points, heightZ);
        const faces = [];

        for (let i = 0; i < points.length; i++) {
            const next = (i + 1) % points.length;
            faces.push({
                depth: Math.max(base[i].y, base[next].y),
                baseA: base[i],
                baseB: base[next],
                topA: top[i],
                topB: top[next]
            });
        }

        faces.sort((a, b) => a.depth - b.depth);
        faces.forEach(face => {
            ctx.beginPath();
            ctx.moveTo(face.baseA.x, face.baseA.y);
            ctx.lineTo(face.baseB.x, face.baseB.y);
            ctx.lineTo(face.topB.x, face.topB.y);
            ctx.lineTo(face.topA.x, face.topA.y);
            ctx.closePath();
            ctx.fillStyle = 'rgba(226, 232, 240, 0.30)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.30)';
            ctx.lineWidth = Math.max(0.5, 0.9 * mapZoom);
            ctx.stroke();
        });

        ctx.beginPath();
        traceProjectedPath(top);
        ctx.fillStyle = style.fill;
        ctx.fill();
        ctx.strokeStyle = style.stroke;
        ctx.lineWidth = Math.max(0.8, 1.25 * mapZoom);
        ctx.stroke();
    }

    function drawCampusFeatures() {
        if (!campusFeaturesData.length) return;

        const orderedFeatures = [...campusFeaturesData].sort((a, b) => {
            if (a.category === b.category) return 0;
            return a.category === 'outdoor' ? -1 : 1;
        });

        orderedFeatures.forEach(feature => {
            const points = feature.points || [];
            if (points.length < 3) return;
            const style = getCampusFeatureStyle(feature);

            drawCampusMassing(feature, points, style);

            if (!is3DMode && mapZoom >= 0.35 && feature.category === 'building') {
                const centroid = getFeatureCentroid(points);
                if (!centroid) return;
                const labelPoint = getProjectedCoords({x: centroid.x, y: centroid.y}, 0);
                ctx.fillStyle = style.labelFill;
                ctx.font = `700 ${Math.max(9, 11 * mapZoom)}px 'Segoe UI', Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(feature.name || feature.label, labelPoint.x, labelPoint.y);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        });
    }

    function getCampusPoiLabel(row) {
        if (!row) return '';
        const zhName = String(row.name_zh || '').trim();
        const enName = String(row.name || '').trim();
        return currentLang === 'zh' ? (zhName || enName) : (enName || zhName);
    }

    function getCampusPoiNodeMatches(row) {
        if (!row || !row.id) return [];
        const id = String(row.id).trim();
        const exact = nodeMap[id];
        if (exact && isCampusNode(exact)) return [exact];
        const prefix = `${id}-`;
        return nodesData.filter(node => isCampusNode(node) && String(node.id || '').startsWith(prefix));
    }

    function getCampusPoiLabelPoint(row) {
        const nodes = getCampusPoiNodeMatches(row);
        if (!nodes.length) return null;
        const sum = nodes.reduce((acc, node) => ({x: acc.x + node.x, y: acc.y + node.y}), {x: 0, y: 0});
        return {
            x: sum.x / nodes.length,
            y: sum.y / nodes.length
        };
    }

    function getCampusBuildingKey(value) {
        return String(value || '')
            .replace(/^Building-/i, '')
            .replace(/^floor-/i, '')
            .replace(/Cafteria/i, 'Cafeteria')
            .toUpperCase();
    }

    function getCampusBuildingFeatureKeys(feature) {
        const massing = feature.massing || {};
        return [
            feature.id,
            feature.name,
            feature.label,
            massing.display_name
        ].map(getCampusBuildingKey).filter(Boolean);
    }

    function getCampusPoiFeature(row) {
        if (!row || !row.id) return null;
        const exactKey = getCampusBuildingKey(row.id);
        const fallbackKey = exactKey.replace(/-\d+$/, '');
        return campusFeaturesData.find(feature => {
            if (feature.category !== 'building') return false;
            const keys = getCampusBuildingFeatureKeys(feature);
            return keys.includes(exactKey) || keys.includes(fallbackKey);
        }) || null;
    }

    function getCampusPoiLabelZ(row) {
        const feature = getCampusPoiFeature(row);
        if (!feature) return 0;
        return getCampusFeatureHeight(feature);
    }

    function isDuplicateCampusBuildingLabel(row) {
        const id = String(row && row.id || '');
        return /^Building-(AU|T1|T4|RB)(?:-|$)/i.test(id);
    }

    function isCampusBuildingPoi(row) {
        return /^Building-/i.test(String(row && row.id || ''));
    }

    function drawCampusPoiLabels() {
        if (!isCampusMode() || !campusPoisData.length) return;
        const drawnKeys = new Set();
        ctx.save();
        campusPoisData.forEach(row => {
            if (!isCampusBuildingPoi(row)) return;
            if (isDuplicateCampusBuildingLabel(row)) return;
            const label = getCampusPoiLabel(row);
            if (!label) return;
            const key = String(row.id || '');
            if (drawnKeys.has(key)) return;
            const point = getCampusPoiLabelPoint(row);
            if (!point) return;
            drawnKeys.add(key);

            const p = getProjectedCoords({x: point.x, y: point.y}, getCampusPoiLabelZ(row));
            const fontSize = Math.max(13, 18 * mapZoom);
            ctx.font = `800 ${fontSize}px 'Segoe UI', Arial`;
            ctx.fillStyle = 'rgba(148, 163, 184, 0.78)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = Math.max(2, 3 * mapZoom);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.58)';
            ctx.strokeText(label, p.x, p.y + 0.5);
            ctx.fillText(label, p.x, p.y + 0.5);
        });
        ctx.restore();
    }

    function drawDraftEdges() {
        if (!DEBUG_MODE || (!draftEdges.length && !(edgeEditorEnabled && edgeEditorSourceId))) return;
        ctx.save();
        draftEdges.forEach(edge => {
            const n1 = nodeMap[edge[0]], n2 = nodeMap[edge[1]];
            if (!n1 || !n2 || !isNodeVisible(n1) || !isNodeVisible(n2)) return;
            const p1 = getProjectedCoords(n1), p2 = getProjectedCoords(n2);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = getCampusEdgeColor(edge[2]);
            ctx.lineWidth = 4 * mapZoom;
            ctx.setLineDash([8 * mapZoom, 5 * mapZoom]);
            ctx.stroke();
        });
        if (edgeEditorEnabled && edgeEditorSourceId && nodeMap[edgeEditorSourceId]) {
            const sourceNode = nodeMap[edgeEditorSourceId];
            if (isNodeVisible(sourceNode)) {
                const sourcePoint = getProjectedCoords(sourceNode);
                ctx.beginPath();
                ctx.moveTo(sourcePoint.x, sourcePoint.y);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = 'rgba(47, 125, 104, 0.42)';
                ctx.lineWidth = 2 * mapZoom;
                ctx.setLineDash([6 * mapZoom, 6 * mapZoom]);
                ctx.stroke();
            }
        }
        ctx.restore();
        ctx.setLineDash([]);
    }

    function addPointModeDepartmentCapsules(topLayerCapsules) {
        if (!isDepartmentMode() || departmentAttributeMode !== 'points') return;
        const groups = new Map();
        poisData.forEach(poi => {
            if (!isNodeVisible(poi) || !isPoiInDepartmentAttributeScope(poi)) return;
            const label = getDepartmentLabelForPoi(poi);
            const group = groups.get(label) || { x: 0, y: 0, z: 0, count: 0 };
            group.x += poi.x;
            group.y += poi.y;
            group.z += poi.z || 0;
            group.count += 1;
            groups.set(label, group);
        });
        groups.forEach((group, label) => {
            if (!group.count) return;
            const p = getProjectedCoords(
                { x: group.x / group.count, y: group.y / group.count },
                group.z / group.count
            );
            const style = getDepartmentCapsuleStyleByText(label);
            topLayerCapsules.push({
                lines: [label],
                x: p.x,
                y: p.y - 36 * mapZoom,
                bgColor: style.bgColor,
                textColor: style.textColor,
                isHovered: false
            });
        });
    }

    function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isAcademicCommunityMode()) {
            minimapWrapper.style.display = 'none';
            angleHint.style.display = 'none';
            updateHUD();
            drawCommunityView();
            return;
        }
        let topLayerCapsules = [];
        const isVolumeMode = currentViewMode === 'volume_only';
        const campusMode = isCampusMode();
        updateHUD();

        minimapWrapper.style.display = is3DMode ? 'none' : 'flex';
        angleHint.style.display = is3DMode ? 'block' : 'none';
        if (!is3DMode) drawMinimap();

        if (showGlGrid) {
            ctx.strokeStyle = 'rgba(150, 150, 160, 0.2)'; ctx.lineWidth = 1 * mapZoom;
            ctx.beginPath();
            for(let i = -500; i <= 1500; i += 50) {
                let p1 = getProjectedCoords({x:i, y:-500, z:0}), p2 = getProjectedCoords({x:i, y:1500, z:0});
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                let p3 = getProjectedCoords({x:-500, y:i, z:0}), p4 = getProjectedCoords({x:1500, y:i, z:0});
                ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
            }
            ctx.stroke();
            let glL = getProjectedCoords({x:0, y:1450, z:0});
            ctx.fillStyle = 'rgba(150,150,150,0.5)'; ctx.font = "bold 12px Arial"; ctx.fillText(t('groundLevel'), glL.x, glL.y);
        }

        drawCampusFeatures();

        const slabsToDraw = [];
        const BLDG_COLORS = { "RB": 'rgba(173, 216, 230, 0.22)', "RB-STACK": 'rgba(173, 216, 230, 0.15)', "T4": 'rgba(144, 238, 144, 0.22)', "T1": 'rgba(255, 235, 153, 0.22)', "AU": 'rgba(251, 146, 60, 0.3)' };

        if (is3DMode) {
            if (campusMode) {
                for (let b in BUILDING_HEIGHTS) {
                    for (let f in BUILDING_HEIGHTS[b]) {
                        if (BLDG_SHAPES[b]) slabsToDraw.push({b, f, z: BUILDING_HEIGHTS[b][f], label: `${b} ${f}F`, color: BLDG_COLORS[b], path: BLDG_SHAPES[b]});
                    }
                }
            } else {
                active3DCheckboxes.forEach(group => {
                    let parts = group.split('-'); let f = parts.pop(), b = parts.join('-'); let z = getNodeElevation(b, f);
                    if (BLDG_SHAPES[b]) slabsToDraw.push({b, f, z, label: `${b} ${f}F`, color: BLDG_COLORS[b], path: BLDG_SHAPES[b]});
                });
            }
            slabsToDraw.sort((a, b) => a.z - b.z);
        } else {
            for (let bldg in BUILDING_HEIGHTS) {
                let closestDist = Infinity, closestFloor = null;
                for (let f in BUILDING_HEIGHTS[bldg]) {
                    let d = Math.abs(BUILDING_HEIGHTS[bldg][f] - currentElevation);
                    if (d < closestDist) { closestDist = d; closestFloor = f; }
                }
                if (closestDist <= 200 && BLDG_SHAPES[bldg]) slabsToDraw.push({b: bldg, f: closestFloor, z: 0, label: `${bldg} ${closestFloor}F`, color: BLDG_COLORS[bldg], path: BLDG_SHAPES[bldg]});
            }
        }

        slabsToDraw.forEach(slab => {
            if (isDepartmentMode() && departmentAttributeMode === 'points') return;
            let finalColor = slab.color;
            if (isDepartmentMode()) {
                finalColor = isSlabInDepartmentAttributeScope(slab)
                    ? getDepartmentSlabColor(slab)
                    : 'rgba(255, 255, 255, 0.12)';
            } else if (slab.f === '1') {
                if (slab.b === 'RB' || slab.b === 'RB-STACK') finalColor = 'rgba(100, 160, 200, 0.40)';
                if (slab.b === 'T4') finalColor = 'rgba(100, 190, 100, 0.40)';
                if (slab.b === 'T1') finalColor = 'rgba(255, 210, 90, 0.40)';
                if (slab.b === 'AU') finalColor = 'rgba(251, 146, 60, 0.40)';
            } else if (slab.f && slab.f.includes('B')) {
                if (slab.b === 'RB' || slab.b === 'RB-STACK') finalColor = 'rgba(100, 160, 200, 0.40)';
                if (slab.b === 'T4') finalColor = 'rgba(100, 190, 100, 0.40)';
            }

            let isBldgActive = currentBuildingFilter === 'General' || slab.b === currentBuildingFilter || (currentBuildingFilter === 'RB' && slab.b === 'RB-STACK');
            if (!isBldgActive) finalColor = 'rgba(200, 200, 200, 0.08)';

            ctx.fillStyle = finalColor; ctx.beginPath();
            slab.path.forEach((pt, i) => {
                let proj = getProjectedCoords({x: pt[0], y: pt[1]}, slab.z);
                i === 0 ? ctx.moveTo(proj.x, proj.y) : ctx.lineTo(proj.x, proj.y);
            });
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = isBldgActive ? 'rgba(255,255,255,0.7)' : 'rgba(200,200,200,0.3)';
            ctx.lineWidth = 1; ctx.stroke();

            if (is3DMode && isBldgActive && !isVolumeMode && !isDepartmentMode() && mapZoom >= 0.48) {
                const labelOnRight = slab.b === 'T4';
                let labelPt = null; let labelX = labelOnRight ? -Infinity : Infinity;
                slab.path.forEach(pt => {
                    let proj = getProjectedCoords({x: pt[0], y: pt[1]}, slab.z);
                    if ((!labelOnRight && proj.x < labelX) || (labelOnRight && proj.x > labelX)) {
                        labelX = proj.x;
                        labelPt = proj;
                    }
                });

                if (labelPt) {
                    ctx.fillStyle = 'rgba(100, 116, 139, 0.85)';
                    ctx.font = `bold ${Math.max(10, 11 * mapZoom)}px 'Segoe UI', Arial`;
                    ctx.textAlign = labelOnRight ? "left" : "right"; ctx.textBaseline = "middle";
                    let sign = slab.z >= 0 ? '+' : '';
                    ctx.fillText(`${slab.f}F ${sign}${slab.z}`, labelPt.x + (labelOnRight ? 10 : -10) * mapZoom, labelPt.y);
                    ctx.textAlign = "left";
                }
            } else if (!is3DMode) {
                if (slab.b === 'RB-STACK') return;
                let p1 = getProjectedCoords({x: slab.path[0][0], y: slab.path[0][1]}, slab.z);
                let textX = p1.x + 20, textY = p1.y + 35;
                ctx.fillStyle = isBldgActive ? 'rgba(51, 65, 85, 0.4)' : 'rgba(150, 150, 150, 0.3)';
                ctx.font = `700 ${Math.max(9, 11 * mapZoom)}px 'Segoe UI', Arial`;
                ctx.fillText(getBuildingFullName(slab.b), textX, textY);
            }
        });

        addPointModeDepartmentCapsules(topLayerCapsules);

        let hoveredBldg = null;
        if (is3DMode) {
            let highestZ = {}, highestPt = {}, highestDeptLabel = {};
            slabsToDraw.forEach(slab => {
                let isBldgActive = currentBuildingFilter === 'General' || slab.b === currentBuildingFilter || (currentBuildingFilter === 'RB' && slab.b === 'RB-STACK');
                if (!isBldgActive) return;
                if (isDepartmentMode() && !isSlabInDepartmentAttributeScope(slab)) return;
                const capsuleKey = isDepartmentMode() ? `${slab.b}-${getDepartmentLabelForSlab(slab)}` : slab.b;

                if (!(capsuleKey in highestZ) || slab.z > highestZ[capsuleKey]) {
                    highestZ[capsuleKey] = slab.z;
                    highestDeptLabel[capsuleKey] = getDepartmentLabelForSlab(slab);
                    if (!isDepartmentMode() && slab.b === 'RB') highestPt[capsuleKey] = {x: 800, y: 650};
                    else if (!isDepartmentMode() && slab.b === 'RB-STACK') highestPt[capsuleKey] = {x: 180, y: 650};
                    else {
                        let sumX = 0, sumY = 0;
                        slab.path.forEach(pt => { sumX+=pt[0]; sumY+=pt[1]; });
                        highestPt[capsuleKey] = {x: sumX/slab.path.length, y: sumY/slab.path.length - 120};
                    }
                }
            });

            for (let key in highestPt) {
                if (!isDepartmentMode() && key === 'RB-STACK') continue;
                let p = getProjectedCoords({x: highestPt[key].x, y: highestPt[key].y}, highestZ[key]);
                p.y -= 50 * mapZoom; let cy = p.y - 30 * mapZoom;
                if (Math.abs(p.x - mouseX) < 140 * mapZoom && Math.abs(cy - mouseY) < 100 * mapZoom) { hoveredBldg = key; break; }
            }

            for (let key in highestZ) {
                if (!isDepartmentMode() && key === 'RB-STACK') continue;
                let p = getProjectedCoords({x: highestPt[key].x, y: highestPt[key].y}, highestZ[key]);
                p.y -= (isDepartmentMode() ? 6 : 50) * mapZoom;
                let isHovered = (hoveredBldg === key);
                const departmentLabel = highestDeptLabel[key];
                const hoverLines = isDepartmentMode() ? null : getBuildingHoverInfo(key);
                let lines = isDepartmentMode()
                    ? [departmentLabel || '暫不分類']
                    : (!isVolumeMode && isHovered && hoverLines ? hoverLines : [getBuildingFullName(key)]);
                const departmentStyle = isDepartmentMode() ? getDepartmentCapsuleStyleByText(departmentLabel) : null;

                topLayerCapsules.push({
                    lines: lines, x: p.x, y: p.y,
                    bgColor: departmentStyle ? departmentStyle.bgColor : (BLDG_PASTEL_COLORS[key] || '#ffffff'),
                    textColor: departmentStyle ? departmentStyle.textColor : (BLDG_TEXT_COLORS[key] || '#1e293b'),
                    isHovered: !isVolumeMode && isHovered
                });
            }
        }

        const isNavigating = currentPath.length > 0;
        const vMode = currentViewMode;

        if (!isVolumeMode) {
        edgesData.forEach(edge => {
            const n1 = nodeMap[edge.from], n2 = nodeMap[edge.to];
            if (!n1 || !n2 || !isNodeVisible(n1) || !isNodeVisible(n2)) return;
            if (!isEdgeDrawableForMode(edge, n1, n2)) return;
            const isCampusEdge = isCampusNode(n1) && isCampusNode(n2);

            let n1Active = currentBuildingFilter === 'General' || n1.building === currentBuildingFilter || (currentBuildingFilter === 'RB' && n1.building === 'RB-STACK');
            let n2Active = currentBuildingFilter === 'General' || n2.building === currentBuildingFilter || (currentBuildingFilter === 'RB' && n2.building === 'RB-STACK');
            let isBldgActive = n1Active && n2Active;

            let isVertical = isVerticalEdge(edge);
            if (vMode === 'main_only' && isVertical) return;
            if (vMode === 'vertical_only' && !isVertical) return;

            let onMainPath = currentPath.includes(edge.from) && currentPath.includes(edge.to);
            let onAltPath = altPath.includes(edge.from) && altPath.includes(edge.to);
            if (vMode === 'point_select' && !onMainPath && !onAltPath) return;
            let p1 = getProjectedCoords(n1), p2 = getProjectedCoords(n2);

            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);

            if (isNavigating) {
                if (activeRoute === 'main' && onMainPath) {
                    ctx.strokeStyle = isVertical ? '#4db0c1' : '#2563eb'; ctx.lineWidth = 6.0 * mapZoom; ctx.setLineDash(isVertical ? [6,6] : []);
                } else if (activeRoute === 'alt' && onAltPath) {
                    ctx.strokeStyle = isVertical ? '#4db0c1' : '#60a5fa'; ctx.lineWidth = 6.0 * mapZoom; ctx.setLineDash(isVertical ? [6,6] : []);
                } else if (onMainPath || onAltPath) {
                    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3.5 * mapZoom; ctx.setLineDash([8, 6]);
                } else {
                    ctx.strokeStyle = 'rgba(241,245,249,0.78)'; ctx.lineWidth = 1.0 * mapZoom; ctx.setLineDash([]);
                }
            } else {
                ctx.setLineDash(isVertical ? [5,5] : []);
                ctx.strokeStyle = isCampusEdge ? getCampusEdgeColor(edge.type) : (isBldgActive ? (isVertical ? 'rgba(77,176,193,0.82)' : (edge.type === 'bridge' ? 'rgba(80,174,142,0.78)' : 'rgba(224,116,116,0.72)')) : 'rgba(178,194,187,0.22)');
                ctx.lineWidth = (edge.type === 'bridge' ? 3.5 : 2.0) * mapZoom;
            }
            ctx.stroke();
        });
        ctx.setLineDash([]);

        if (vMode !== 'vertical_only' && !campusMode) {
            poisData.forEach(poi => {
                if (isNodeVisible(poi)) {
                    let poiOnPath = currentPath.includes(poi.id) || altPath.includes(poi.id);
                    let isSelected = poi.id === tempStart || poi.id === tempEnd;
                    if (isDepartmentMode() && !poiOnPath && !isSelected) return;
                    if (vMode === 'main_only' && !poiOnPath && !isSelected) return;

                    (connectionsData[poi.id] || []).forEach(tid => {
                        const tn = nodeMap[tid];
                        if (tn && isNodeVisible(tn)) {
                            let onPath = currentPath.includes(poi.id) && currentPath.includes(tid);
                            if (isDepartmentMode() && !onPath) return;
                            if (vMode === 'point_select' && !onPath) return;
                            if (!isNavigating || onPath || (!onPath && vMode !== 'main_only')) {
                                let p1 = getProjectedCoords(poi), p2 = getProjectedCoords(tn);
                                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = onPath ? '#a8b7c8' : 'rgba(206,214,210,0.32)';
                                ctx.lineWidth = (onPath ? 3.0 : 1.5) * mapZoom; ctx.stroke();
                            }
                        }
                    });
                }
            });
        }

        drawDraftEdges();

        const allNodes = [...nodesData, ...poisData].filter(n => isNodeVisible(n) && isNodeDrawableForMode(n));
        allNodes.sort((a, b) => getProjectedCoords(a).y - getProjectedCoords(b).y);

        let activePathArray = activeRoute === 'main' ? currentPath : altPath;

        allNodes.forEach(node => {
            let onPath = currentPath.includes(node.id) || altPath.includes(node.id);
            let onActivePath = activePathArray.includes(node.id);
            let isSelected = node.id === tempStart || node.id === tempEnd;
            let isEdgeSource = DEBUG_MODE && edgeEditorEnabled && node.id === edgeEditorSourceId;
            let isEdgeHovered = DEBUG_MODE && edgeEditorEnabled && node.id === edgeEditorHoverNodeId;
            if (vMode === 'main_only' && node.type === 'poi' && !onPath && !isSelected) return;
            let isBldgActive = currentBuildingFilter === 'General' || node.building === currentBuildingFilter || (currentBuildingFilter === 'RB' && node.building === 'RB-STACK');

            let p = getProjectedCoords(node);
            let nodeColor = node.color || '#94a3b8';
            if (isDepartmentMode() && isOrangeNode(node)) {
                nodeColor = getDepartmentNodeColor(node);
            } else if (vMode !== 'point_select' && isNavigating && !onActivePath) {
                nodeColor = '#dbe5e1';
            } else if (!isBldgActive && !isSelected && !onPath) {
                nodeColor = '#dbe5e1';
            }

            let radius = node.type === 'poi' ? 5.0 : 7.0;
            if (isCampusNode(node)) radius = isCampusPathNode(node) ? 8.0 : 9.5;
            if (onActivePath) radius = Math.max(radius, isCampusNode(node) ? 11.0 : 8.5);
            if (isSelected) radius = Math.max(radius, isCampusNode(node) ? 13.0 : 12.0);
            if (isEdgeSource) radius = Math.max(radius, isCampusNode(node) ? 12.0 : 11.0);

            ctx.beginPath(); ctx.arc(p.x, p.y, radius * mapZoom, 0, 2 * Math.PI);
            ctx.fillStyle = nodeColor; ctx.fill();
            ctx.strokeStyle = (vMode !== 'point_select' && isNavigating && !onActivePath) || !isBldgActive ? 'transparent' : '#ffffff';
            ctx.lineWidth = 1.5 * mapZoom; ctx.stroke();

            if (isEdgeHovered || isEdgeSource) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, (radius + (isEdgeSource ? 7 : 4)) * mapZoom, 0, 2 * Math.PI);
                ctx.strokeStyle = isEdgeSource ? 'rgba(47, 125, 104, 0.95)' : 'rgba(47, 125, 104, 0.42)';
                ctx.lineWidth = (isEdgeSource ? 3 : 2) * mapZoom;
                ctx.stroke();
            }

            if (isEdgeSource) {
                drawStartEndCapsule(ctx, node.id, p.x + 15 * mapZoom, p.y, '#2f7d68');
            } else if (isSelected) {
                const capsuleStyle = getSelectedNodeCapsuleStyle(node);
                drawStartEndCapsule(
                    ctx,
                    getSelectedNodeCapsuleLabel(node),
                    p.x + 15 * mapZoom,
                    p.y,
                    capsuleStyle.bgColor,
                    capsuleStyle.textColor,
                    capsuleStyle.strokeColor
                );
            } else if (isNavigating && onActivePath) {
                let pIdx = activePathArray.indexOf(node.id);
                if (pIdx > 0 && pIdx < activePathArray.length - 1 && (pIdx % 3 === 0 || node.id.includes('Stair'))) {
                    ctx.fillStyle = '#1f3a34'; ctx.font = `bold ${Math.max(11, 11 * mapZoom)}px sans-serif`;
                    ctx.fillText(node.id, p.x + 10 * mapZoom, p.y - 4 * mapZoom);
                }
            }
        });

        }

        drawCampusPoiLabels();
        topLayerCapsules.forEach(cap => drawDynamicCapsule(ctx, cap.lines, cap.x, cap.y, cap.bgColor, cap.textColor, cap.isHovered));
    }

    function fetchRoute(start, end) {
        setInfoBox(() => t('routeSolving'));
        const params = new URLSearchParams({ start, end, mode: currentRouteMode });
        fetch(`/api/route?${params.toString()}`)
            .then(async res => {
                const payload = await res.json().catch(() => null);
                if (!res.ok) {
                    const detail = payload && payload.detail ? payload.detail : null;
                    const err = new Error(detail && detail.message ? detail.message : t('routeDisconnected'));
                    err.reason = detail && detail.reason ? detail.reason : '';
                    throw err;
                }
                return payload;
            })
            .then(data => {
                currentPath = data.path; altPath = data.alt_path || []; activeRoute = 'main';
                currentRouteDistance = Number(data.total_distance);

                if (is3DMode) {
                    active3DCheckboxes.clear();
                    currentPath.forEach(nId => { if(nodeMap[nId]) active3DCheckboxes.add(`${nodeMap[nId].building}-${nodeMap[nId].floor_name}`); });
                    document.querySelectorAll('#floor-checkboxes input').forEach(cb => cb.checked = active3DCheckboxes.has(cb.value));
                } else {
                    const startNode = nodeMap[start];
                    if (startNode) { currentElevation = startNode.z; elevationSelect.value = String(currentElevation); }
                }
                updateRouteSummary();
                drawMap();
                setInfoBox(() => {
                    let html = `<b>${t('routeSuccess')}</b>\n${t('routeModeLabel')}<b>${getRouteModeLabel(data.mode || currentRouteMode)}</b>\n${t('mainDistance')}<span style="color:#2563eb;font-weight:bold;">${data.total_distance}</span> m`;
                    html += `\n\n<b>${t('directions')}</b>\n`;
                    data.directions.forEach((d, idx) => html += `${idx + 1}. ${d}\n`);
                    return html;
                });
            }).catch(err => {
                currentPath = []; altPath = []; activeRoute = 'main'; currentRouteDistance = null; updateRouteSummary(); drawMap();
                setInfoBox(() => err.reason === 'no_stair_free_route' ? t('noStairFreeRoute') : `${t('routeFail')}${err.message}`);
            });
    }

    document.getElementById('route-btn').addEventListener('click', () => {
        const s = resolveSelectedSpace('start'), e = resolveSelectedSpace('end');
        if(s && e) { tempStart = s; tempEnd = e; fetchRoute(s, e); }
        else {
            if (!s) renderSpaceResults('start');
            if (!e) renderSpaceResults('end');
            setInfoBox(() => t('invalidSelection'));
        }
    });

    poiDetailClose.addEventListener('click', closePoiDetailCard);
    poiSetStartBtn.addEventListener('click', () => setPoiEndpoint('start'));
    poiSetEndBtn.addEventListener('click', () => setPoiEndpoint('end'));
    document.querySelectorAll('.dept-mode-btn').forEach(button => {
        button.addEventListener('click', () => setDepartmentAttributeMode(button.dataset.deptMode));
    });
    communityDepartmentFilter.addEventListener('change', () => {
        communityDepartmentSelection = communityDepartmentFilter.value || 'all';
        communitySelectedNodeId = null;
        initializeCommunityLayout();
        updateCommunityControls();
        startCommunitySimulation(true);
        drawMap();
    });
    communityShowAllPoisInput.addEventListener('change', () => {
        communityShowAllPois = communityShowAllPoisInput.checked;
        communitySelectedNodeId = null;
        initializeCommunityLayout();
        updateCommunityControls();
        startCommunitySimulation(true);
        drawMap();
    });
    communityResetLayoutBtn.addEventListener('click', resetCommunityLayout);

    document.getElementById('clear-btn').addEventListener('click', () => {
        currentPath = []; altPath = []; currentRouteDistance = null; tempStart = null; tempEnd = null; clickState = 0;
        updateRouteSummary();
        selectedSpaceIds = { start: null, end: null };
        startSpaceInput.value = ""; endSpaceInput.value = "";
        startSpaceMenu.classList.remove('open'); endSpaceMenu.classList.remove('open');
        if (is3DMode) document.querySelectorAll('#floor-checkboxes input').forEach(cb => { cb.checked = true; active3DCheckboxes.add(cb.value); });
        updateSelectPlaceholders();
        closePoiDetailCard();
        setInfoBox(() => t('infoInitial'));
        drawMap();
    });

    let isDragging = false, isMoved = false, dragStartX = 0, dragStartY = 0, initOffsetX = 0, initOffsetY = 0, initRot = 0;

    canvas.addEventListener('mousedown', e => {
        isDragging = true; isMoved = false; dragStartX = e.clientX; dragStartY = e.clientY;
        if (isAcademicCommunityMode()) {
            initOffsetX = communityViewport.offsetX;
            initOffsetY = communityViewport.offsetY;
            initRot = 0;
        } else {
            initOffsetX = mapOffsetX; initOffsetY = mapOffsetY; initRot = mapRotation;
        }
    });

    window.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (isDragging) {
            const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isMoved = true;
            if (isAcademicCommunityMode()) {
                communityViewport.offsetX = initOffsetX + dx;
                communityViewport.offsetY = initOffsetY + dy;
            } else if (e.altKey || e.ctrlKey || e.metaKey) {
                mapRotation = initRot + (dx * 0.01);
            } else {
                mapOffsetX = initOffsetX + dx; mapOffsetY = initOffsetY + dy;
            }
            hoverTooltip.style.display = 'none'; drawMap();
        } else {
            if (isAcademicCommunityMode()) {
                const hovered = findCommunityNodeAt(mouseX, mouseY);
                communityHoveredNodeId = hovered ? hovered.id : null;
                if (hovered) renderCommunityHoverTooltip(hovered, e);
                else hoverTooltip.style.display = 'none';
                drawMap();
                return;
            }

            if (currentViewMode === 'volume_only') {
                hoverTooltip.style.display = 'none';
                drawMap();
                return;
            }

            const editorHoverNode = edgeEditorEnabled ? findClosestNodeAt(15 * Math.max(1, mapZoom), false) : null;
            edgeEditorHoverNodeId = editorHoverNode ? editorHoverNode.id : null;
            const hoveredNode = editorHoverNode || findClosestNodeAt(15 * Math.max(1, mapZoom), true);

            if (shouldShowHoverTooltip(hoveredNode)) {
                renderHoverTooltip(hoveredNode, e);
            } else {
                hoverTooltip.style.display = 'none';
            }
            drawMap();
        }
    });

    window.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        if (isAcademicCommunityMode()) {
            const oldZoom = communityViewport.zoom;
            const nextZoom = Math.min(Math.max(oldZoom + (e.deltaY * -0.001), 0.45), 2.8);
            communityViewport.zoom = nextZoom;
            drawMap();
            return;
        }
        mapZoom = Math.min(Math.max(mapZoom + (e.deltaY * -0.001), 0.2), 5); drawMap();
    });

    canvas.addEventListener('click', (event) => {
        if (isMoved) return;
        if (isAcademicCommunityMode()) {
            const rect = canvas.getBoundingClientRect();
            mouseX = (event.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (event.clientY - rect.top) * (canvas.height / rect.height);
            const node = findCommunityNodeAt(mouseX, mouseY);
            communitySelectedNodeId = node ? node.id : null;
            renderCommunitySelectionInfo(node);
            if (node && node.kind === 'poi') {
                selectedPoiForCard = node.poi;
                renderPoiDetailCard();
            } else {
                closePoiDetailCard();
            }
            drawMap();
            return;
        }
        if (currentViewMode === 'volume_only') return;
        const rect = canvas.getBoundingClientRect();
        mouseX = (event.clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (event.clientY - rect.top) * (canvas.height / rect.height);

        if (edgeEditorEnabled && handleEdgeEditorNodeClick(findClosestNodeAt(20 * Math.max(1, mapZoom), false))) return;

        let closestNode = findClosestNodeAt(20 * Math.max(1, mapZoom), true);

        if (closestNode) {
            if (closestNode.type === 'poi') {
                showPoiDetailCard(closestNode);
                hoverTooltip.style.display = 'none';
                return;
            }

            if (clickState === 0) {
                tempStart = closestNode.id;
                selectSpace('start', tempStart);
                setInfoBox(() => `${t('startSet')}<b>${getEndpointLabel(tempStart)}</b>\n${t('chooseEnd')}`);
                clickState = 1; drawMap();
            } else if (clickState === 1) {
                tempEnd = closestNode.id;
                selectSpace('end', tempEnd);
                setInfoBox(() => `${t('endSet')}<b>${getEndpointLabel(tempEnd)}</b>\n${t('calculating')}`);
                clickState = 0; fetchRoute(tempStart, tempEnd);
            }
        }
    });
</script>
</body>
</html>
