<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧室內導航系統 (SIP) | 3D BIM Dashboard</title>
    <style>
        :root {
            --bg-main: #edf5f1;
            --bg-gradient: radial-gradient(circle at top left, rgba(178, 220, 205, 0.42), transparent 28%), linear-gradient(180deg, #f8fcfa 0%, #edf5f1 52%, #e8f2ee 100%);
            --bg-panel: rgba(251, 255, 253, 0.92);
            --bg-soft: #f4f9f6;
            --bg-control: rgba(255, 255, 255, 0.96);
            --map-bg: #edf5f1;
            --text-main: #1f3a34;
            --text-muted: #5f7b73;
            --text-faint: #7c958e;
            --primary: #2f7d68;
            --primary-hover: #256754;
            --primary-soft: #e4f2ec;
            --accent: #76b4a0;
            --danger: #b65050;
            --danger-soft: #f8e3e1;
            --route-main: #0068b7;
            --route-alt: #60a5fa;
            --vertical-color: #3c8f80;
            --vertical-soft: #e2f3ee;
            --border: rgba(71, 107, 96, 0.16);
            --border-strong: rgba(47, 125, 104, 0.28);
            --shadow-sm: 0 8px 20px rgba(48, 84, 73, 0.08);
            --shadow-md: 0 14px 36px rgba(48, 84, 73, 0.12);
        }

        body {
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 16px;
            background: var(--bg-gradient); color: var(--text-main);
            height: 100vh; width: 100vw; box-sizing: border-box; overflow: hidden;
            line-height: 1.45;
            letter-spacing: 0.01em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255,255,255,0.34) 0, rgba(255,255,255,0.1) 1px, transparent 1px),
                        linear-gradient(180deg, rgba(255,255,255,0.26) 0, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.16;
        }

        * { box-sizing: border-box; }
        button, select { font: inherit; }

        .container {
            width: 100%; height: calc(100vh - 32px); display: flex; gap: 16px;
            position: relative; z-index: 1;
        }

        .control-panel {
            flex: 0 0 460px;
            background: var(--bg-panel);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: 22px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(18px);
        }

        .panel-header { display: flex; flex-direction: column; gap: 5px; padding-bottom: 4px; line-height: 1.35; }
        .panel-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .app-eyebrow {
            color: var(--primary); font-size: 0.76rem; font-weight: 800;
            letter-spacing: 0.08em; text-transform: uppercase;
        }
        .app-title { margin: 0; font-size: 1.48rem; font-weight: 850; letter-spacing: 0; color: var(--text-main); line-height: 1.28; }
        .app-subtitle { margin: 0; color: var(--text-muted); font-size: 0.87rem; line-height: 1.35; }
        .language-toggle {
            min-width: 52px; min-height: 30px; padding: 5px 10px;
            border: 1px solid rgba(47,125,104,0.16); border-radius: 8px;
            background: rgba(255,255,255,0.82); color: var(--primary);
            font-size: 0.78rem; font-weight: 850; cursor: pointer;
            transition: all 0.2s;
        }
        .language-toggle:hover { background: var(--primary-soft); border-color: rgba(47,125,104,0.28); }
        .panel-section {
            display: flex; flex-direction: column; gap: 8px;
            padding: 10px 12px;
            border: 1px solid rgba(47,125,104,0.12);
            border-radius: 15px;
            background: rgba(255,255,255,0.74);
            box-shadow: var(--shadow-sm);
        }

        .map-container {
            flex: 1; background: linear-gradient(180deg, #f7fbf9 0%, #edf5f1 100%); position: relative;
            display: flex; align-items: center; justify-content: center;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .top-filter-bar {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 30;
            background: rgba(255,255,255,0.78); padding: 8px 10px;
            border-radius: 16px; box-shadow: var(--shadow-sm);
            backdrop-filter: blur(14px); border: 1px solid rgba(47,125,104,0.12);
            max-width: calc(100% - 240px); overflow-x: auto; scrollbar-width: none;
        }
        .top-filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn {
            min-height: 34px; padding: 7px 14px; border: 1px solid transparent; background: transparent; border-radius: 10px;
            font-size: 0.84rem; font-weight: 760; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: rgba(47,125,104,0.12); }
        .filter-btn.active { background: var(--primary); color: white; box-shadow: 0 8px 18px rgba(47, 125, 104, 0.24); }

        .route-selector {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; background: rgba(255,255,255,0.92); padding: 6px; border-radius: 16px;
            box-shadow: var(--shadow-md); z-index: 30; border: 1px solid rgba(47,125,104,0.14);
            backdrop-filter: blur(12px); gap: 4px;
        }
        .route-select-btn {
            min-height: 38px; padding: 9px 18px; border: none; background: transparent; border-radius: 10px;
            font-size: 0.88rem; font-weight: 800; cursor: pointer; color: var(--text-muted); transition: all 0.2s;
            white-space: nowrap;
        }
        .route-select-btn:hover { background: var(--bg-soft); }
        .route-select-btn.active { background: var(--primary); color: white; box-shadow: 0 8px 18px rgba(47,125,104,0.22); }

        .hover-tooltip {
            position: fixed; display: none; background: rgba(255,255,255,0.96); color: var(--text-main);
            padding: 14px 18px; border-radius: 14px; pointer-events: none; z-index: 9999;
            box-shadow: var(--shadow-md); font-size: 0.9rem; border: 1px solid rgba(47,125,104,0.14);
            backdrop-filter: blur(12px);
        }
        .hover-tooltip .tt-title { font-weight: 850; font-size: 1rem; margin-bottom: 8px; color: var(--primary); border-bottom: 1px solid rgba(47,125,104,0.12); padding-bottom: 6px; }
        .hover-tooltip .tt-meta { display: flex; flex-direction: column; gap: 6px; color: var(--text-muted); }
        .hover-tooltip .tt-meta span.tt-val { color: var(--text-main); font-weight: 700; }

        .poi-detail-card {
            position: absolute; left: 18px; top: 18px; z-index: 35;
            width: min(360px, calc(100% - 124px)); max-height: calc(100% - 36px);
            display: flex; flex-direction: column; gap: 12px;
            padding: 14px; border-radius: 14px;
            background: rgba(255,255,255,0.96); border: 1px solid rgba(47,125,104,0.16);
            box-shadow: var(--shadow-md); backdrop-filter: blur(14px);
            overflow: auto;
        }
        .poi-detail-card.hidden { display: none; }
        .poi-detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .poi-detail-title { margin: 0; color: var(--text-main); font-size: 1.02rem; font-weight: 880; line-height: 1.3; }
        .poi-detail-close {
            flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px;
            border: 1px solid rgba(47,125,104,0.12); background: rgba(244,249,246,0.9);
            color: var(--text-muted); cursor: pointer; font-size: 1.1rem; line-height: 1;
        }
        .poi-detail-close:hover { color: var(--primary); background: var(--primary-soft); }
        .poi-detail-fields { display: grid; gap: 8px; }
        .poi-detail-row { display: grid; gap: 2px; }
        .poi-detail-label { color: var(--text-faint); font-size: 0.68rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
        .poi-detail-value { color: var(--text-main); font-size: 0.84rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
        .poi-detail-description { font-weight: 620; color: var(--text-muted); }
        .poi-detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .poi-detail-action {
            min-height: 36px; border: 1px solid rgba(47,125,104,0.13); border-radius: 10px;
            background: #f9fcfa; color: var(--primary); font-size: 0.82rem; font-weight: 820;
            cursor: pointer;
        }
        .poi-detail-action:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* 🌟 Item 2: 分群直列相機控制 (4 / 4 / 4 / 1) */
        .camera-controls-wrapper {
            position: absolute; top: 28px; right: 18px; z-index: 20;
            display: flex; flex-direction: column; gap: 10px;
        }
        .camera-control-group {
            display: flex; flex-direction: column; gap: 6px;
            background: rgba(255,255,255,0.86); padding: 7px; border-radius: 15px;
            box-shadow: var(--shadow-sm); border: 1px solid rgba(47,125,104,0.12);
            backdrop-filter: blur(14px);
        }
        .camera-controls-wrapper button {
            width: 42px; height: 42px; padding: 0; background: rgba(255,255,255,0.95); border: 1px solid rgba(47,125,104,0.1);
            border-radius: 10px; font-size: 0.92rem; color: var(--text-main); display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; cursor: pointer; font-weight: 800;
        }
        .camera-controls-wrapper button:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-1px); }
        .camera-controls-wrapper button:active { transform: scale(0.95); }

        .hud-bottom-left {
            position: absolute; bottom: 18px; left: 18px; z-index: 20;
            display: flex; align-items: flex-end; gap: 16px; pointer-events: none;
        }
        .compass-container {
            width: 64px; height: 64px; background: rgba(255,255,255,0.82); border-radius: 50%;
            border: 1px solid rgba(47,125,104,0.14); box-shadow: var(--shadow-sm);
            position: relative; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .compass-needle {
            position: absolute; width: 4px; height: 40px; background: linear-gradient(to top, #8ca49d 50%, #b75a5a 50%);
            border-radius: 999px; transition: transform 0.1s ease-out;
        }
        .compass-n-text { position: absolute; top: -18px; font-weight: 900; color: #b75a5a; font-size: 13px; }
        .scale-container {
            background: rgba(255,255,255,0.82); padding: 8px 12px; border-radius: 13px;
            border: 1px solid rgba(47,125,104,0.12); box-shadow: var(--shadow-sm); backdrop-filter: blur(8px);
        }
        .scale-text { font-size: 0.8rem; font-weight: 800; color: var(--text-main); text-align: center; margin-bottom: 4px; }
        .scale-bar { height: 4px; border-left: 2px solid var(--text-main); border-right: 2px solid var(--text-main); border-bottom: 2px solid var(--text-main); transition: width 0.1s; }
        .angle-hint {
            position: absolute; right: 18px; bottom: 18px; z-index: 25;
            max-width: 320px; padding: 9px 12px; border-radius: 12px;
            background: rgba(255,255,255,0.88); border: 1px solid rgba(47,125,104,0.14);
            box-shadow: var(--shadow-sm); color: var(--text-muted); font-size: 0.76rem; font-weight: 760;
            display: none;
        }
        .route-summary {
            position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 35;
            display: none; pointer-events: none; text-align: center; align-items: center; gap: 10px;
        }
        .route-summary-mode, .route-summary-sub {
            color: #1d4ed8; font-size: 0.9rem; font-weight: 850;
            text-shadow: 0 1px 0 rgba(255,255,255,0.95), 0 4px 12px rgba(255,255,255,0.72);
            white-space: nowrap;
        }
        .route-summary-main {
            color: #1d4ed8; font-size: 1.05rem; font-weight: 900; line-height: 1.2;
            text-shadow: 0 1px 0 rgba(255,255,255,0.95), 0 4px 12px rgba(255,255,255,0.72);
            white-space: nowrap;
        }

        /* 🌟 Item 4: Minimap 放大版 (460x420)，讓正方形區域更大 */
        .minimap-wrapper {
            position: absolute; bottom: 18px; right: 18px; z-index: 20;
            width: 420px; height: 380px; background: rgba(255,255,255,0.88); border-radius: 18px;
            box-shadow: var(--shadow-md); border: 1px solid rgba(47,125,104,0.14);
            overflow: hidden; backdrop-filter: blur(14px); display: none;
            flex-direction: column;
        }
        .minimap-title {
            background: rgba(244,249,246,0.94); padding: 10px; font-size: 0.75rem; font-weight: 800; text-align: center;
            color: var(--text-muted); border-bottom: 1px solid rgba(47,125,104,0.1);
            letter-spacing: 0.06em;
        }
        .minimap-canvas { width: 100%; height: calc(100% - 38px); }

        .canvas-wrapper {
            width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(249,252,250,0.75), rgba(235,244,240,0.48));
        }
        canvas { display: block; width: 100%; height: 100%; cursor: grab; }
        canvas:active { cursor: grabbing; }

        .section-title { margin-bottom: 5px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-faint); font-weight: 850; }

        .view-mode-groups { display: grid; gap: 12px; }
        .view-mode-group { display: grid; gap: 7px; }
        .view-mode-heading {
            font-size: 0.68rem; font-weight: 880; color: var(--text-faint);
            letter-spacing: 0.1em; text-transform: uppercase;
        }
        .view-mode-primary { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .view-mode-secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .view-btn {
            min-height: 36px; padding: 7px 10px; border: 1px solid rgba(47,125,104,0.12); background: #f9fcfa;
            border-radius: 11px; cursor: pointer; font-size: 0.8rem; font-weight: 760; color: var(--text-muted); transition: all 0.2s;
        }
        .view-btn.primary-view {
            min-height: 42px; padding: 10px 12px; font-size: 0.9rem; font-weight: 850;
            background: #e4f4ec; border-color: rgba(47,125,104,0.2); color: #256754;
        }
        .view-btn.department-view,
        .view-btn.campus-view {
            background: #e4f4ec; border-color: rgba(47,125,104,0.2); color: #256754;
        }
        .view-btn.secondary-view { min-height: 31px; padding: 5px 8px; font-size: 0.73rem; border-radius: 9px; }
        .view-btn:hover { border-color: rgba(47,125,104,0.22); background: var(--primary-soft); color: var(--primary); }
        .view-btn.department-view:hover,
        .view-btn.campus-view:hover { background: var(--primary-soft); border-color: rgba(47,125,104,0.22); color: var(--primary); }
        .view-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 8px 16px rgba(47,125,104,0.18); }
        .view-btn.department-view.active,
        .view-btn.campus-view.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 8px 16px rgba(47,125,104,0.18); }

        .community-panel { display: none; }
        .community-panel.open { display: grid; gap: 9px; }
        .community-controls { display: grid; gap: 8px; }
        .community-toggle {
            display: inline-flex; align-items: center; gap: 8px; font-size: 0.78rem;
            font-weight: 780; color: var(--text-main);
        }
        .community-action-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
        .community-reset-btn {
            min-height: 34px; padding: 7px 10px; border-radius: 10px; border: 1px solid rgba(217,119,6,0.18);
            background: #fffbeb; color: #92400e; font-size: 0.76rem; font-weight: 820; cursor: pointer;
        }
        .community-summary { font-size: 0.73rem; line-height: 1.42; color: var(--text-muted); }

        .select-group { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
        select, input.space-search {
            width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid rgba(47,125,104,0.13);
            border-radius: 11px; font-size: 0.84rem; background-color: #fbfdfc; color: var(--text-main); outline: none;
        }
        select:focus, input.space-search:focus { border-color: rgba(47,125,104,0.35); box-shadow: 0 0 0 4px rgba(47,125,104,0.08); }
        .space-picker { position: relative; }
        .space-results {
            display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40;
            max-height: 260px; overflow-y: auto; padding: 6px; border-radius: 12px;
            background: rgba(255,255,255,0.98); border: 1px solid rgba(47,125,104,0.16);
            box-shadow: var(--shadow-md);
        }
        .space-results.open { display: block; }
        .space-result {
            width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px;
            padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
        }
        .space-result:hover, .space-result.active { background: var(--primary-soft); }
        .space-result-title { font-size: 0.84rem; font-weight: 820; color: var(--text-main); }
        .space-result-meta { font-size: 0.72rem; color: var(--text-muted); }
        .space-result-group { padding: 7px 10px 4px; font-size: 0.68rem; font-weight: 850; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; }
        .space-result-empty { padding: 10px; color: var(--text-muted); font-size: 0.8rem; }

        .btn-container { display: flex; gap: 10px; }
        button.action-btn {
            min-height: 40px; padding: 9px 12px; border-radius: 11px; font-size: 0.93rem;
            cursor: pointer; font-weight: 800; border: 1px solid transparent; transition: all 0.2s;
        }
        button.action-btn:hover { transform: translateY(-1px); }
        #route-btn { background: linear-gradient(135deg, var(--primary), #4a967f); color: white; flex: 2; box-shadow: 0 10px 22px rgba(47,125,104,0.2); }
        #clear-btn { background-color: var(--danger-soft); color: var(--danger); flex: 1; border-color: transparent; }

        #toggle-3d-btn { background: linear-gradient(135deg, var(--vertical-color), #62aa98); color: white; width: 100%; box-shadow: 0 10px 22px rgba(60,143,128,0.18); }

        .floor-selector-list {
            display: flex; flex-direction: column; gap: 8px; max-height: 128px; overflow-y: auto;
            border: 1px solid rgba(47,125,104,0.12); padding: 8px; border-radius: 13px; background: #f9fcfa;
        }
        .bldg-group-title { font-size: 0.76rem; font-weight: 800; color: var(--primary); border-bottom: 1px solid rgba(47,125,104,0.12); padding-bottom: 3px; margin-bottom: 6px; }
        .bldg-group-items { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
        .floor-checkbox-item { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 760; color: var(--text-main); cursor: pointer; background: var(--primary-soft); padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(47,125,104,0.08); transition: all 0.2s; }
        .floor-checkbox-item:hover { background: #d8ece3; }

        #info-box {
            background: linear-gradient(180deg, #f9fcfa, #f2f7f5); padding: 10px 12px; border-radius: 13px; font-size: 0.82rem;
            white-space: pre-wrap; line-height: 1.45; border: 1px solid rgba(47,125,104,0.12); color: var(--text-main);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .debug-panel { display: none; border-color: rgba(47,125,104,0.24); background: rgba(244,249,246,0.9); }
        .debug-row { display: grid; gap: 6px; }
        .debug-toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--text-main); font-size: 0.82rem; font-weight: 820; }
        .debug-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .debug-btn {
            min-height: 34px; padding: 7px 10px; border-radius: 10px; border: 1px solid rgba(47,125,104,0.13);
            background: #fbfdfc; color: var(--primary); font-size: 0.78rem; font-weight: 820; cursor: pointer;
        }
        .debug-btn:hover { background: var(--primary-soft); border-color: rgba(47,125,104,0.22); }
        .debug-btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
        .debug-status, .debug-meta, .debug-list {
            color: var(--text-muted); font-size: 0.76rem; line-height: 1.38; overflow-wrap: anywhere;
        }
        .debug-status { min-height: 20px; font-weight: 760; }
        .debug-list {
            max-height: 110px; overflow-y: auto; padding: 7px 8px; border-radius: 10px;
            border: 1px solid rgba(47,125,104,0.1); background: rgba(255,255,255,0.72);
        }
        .debug-list-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid rgba(47,125,104,0.08); }
        .debug-list-row:first-child { border-top: 0; }
        .debug-edge-main { display: grid; gap: 5px; min-width: 0; }
        .debug-edge-label { color: var(--text-main); font-size: 0.74rem; font-weight: 760; overflow-wrap: anywhere; }
        .debug-edge-controls { display: flex; gap: 6px; align-items: center; }
        .debug-edge-type { min-width: 0; width: 100%; font-size: 0.72rem; padding: 5px 7px; }
        .debug-edge-swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; border: 1px solid rgba(255,255,255,0.85); }
        .debug-btn.compact { min-height: 28px; padding: 5px 8px; border-radius: 8px; font-size: 0.72rem; }

        .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.73rem; padding: 10px 12px; background: linear-gradient(180deg, #f9fcfa, #f3f8f6); border-radius: 13px; border: 1px solid rgba(47,125,104,0.12); }
        .legend-item { display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
        .color-box { width: 10px; height: 10px; border-radius: 50%; }

        @media (max-width: 980px) {

            </div>

    function normalizeSearchText(value) {
        return String(value || '').normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function compactSearchText(value) {
        return normalizeSearchText(value).replace(/[\s,，、;；/／|｜()（）\[\]【】._-]+/g, '');
    }

    function getSearchValueList(value) {
        if (value === null || value === undefined) return [];
        if (Array.isArray(value)) return value.flatMap(item => getSearchValueList(item));
        const raw = String(value || '').trim();
        if (!raw) return [];
        const parts = raw.split(/[;；,，、/／|｜]+/).map(part => part.trim()).filter(Boolean);
        return parts.length > 1 ? [raw, ...parts] : [raw];
    }

    function buildSpaceSearchEntries(node) {
        const entries = [];
        const seen = new Set();
        const add = (field, value) => {
            getSearchValueList(value).forEach(rawValue => {
                const text = normalizeSearchText(rawValue);
                const compactText = compactSearchText(rawValue);
                if (!text || !compactText) return;
                const key = `${field}:${compactText}`;
                if (seen.has(key)) return;
                seen.add(key);
                entries.push({ field, value: rawValue, text, compactText });
            });
        };

        add('id', node.id);
        add('display_name', getSpaceDisplayName(node));
        add('name_zh', node.name_zh);
        add('name_en', node.name_en);
        add('name', node.name);
        add('aliases', node.aliases || node.alias);
        add('faculty_leads', node.faculty_leads);
        add('occupants', node.occupants);
        add('department', node.department);
        add('category', node.category);
        add('building', node.building);
        add('floor_name', node.floor_name);

        return entries;
    }

    const SPACE_SEARCH_FIELD_PRIORITY = {
        id: 0,
        occupants: 0.2,
        faculty_leads: 0.4,
        aliases: 0.8,
        name_zh: 1,
        name_en: 1.2,
        display_name: 1.4,
        name: 1.6,
        department: 3,
        category: 4,
        building: 5,
        floor_name: 6
    };

    function scoreSpaceSearchEntry(entry, normalizedQuery, compactQuery) {
        const priority = SPACE_SEARCH_FIELD_PRIORITY[entry.field] ?? 10;
        if (entry.text === normalizedQuery) return priority;
        if (entry.compactText === compactQuery) return priority + 0.05;
        if (entry.text.startsWith(normalizedQuery)) return priority + 10;
        if (entry.compactText.startsWith(compactQuery)) return priority + 10.05;
        if (entry.text.includes(normalizedQuery)) return priority + 20;
        if (entry.compactText.includes(compactQuery)) return priority + 20.05;
        return Infinity;
    }

    function getSpaceSearchMatch(item, query) {
        const normalizedQuery = normalizeSearchText(query);
        const compactQuery = compactSearchText(query);
        if (!normalizedQuery || !compactQuery) return { score: 0, entry: null };

        let best = { score: Infinity, entry: null };
        item.searchEntries.forEach(entry => {
            const score = scoreSpaceSearchEntry(entry, normalizedQuery, compactQuery);
            if (score < best.score) best = { score, entry };
        });
        return best;
    }

    function compareSpaceSearchMatches(a, b) {
        if (a.matchScore !== b.matchScore) return a.matchScore - b.matchScore;
        if (a.isPoi !== b.isPoi) return a.isPoi ? -1 : 1;
        return a.id.localeCompare(b.id);
    }

    function rebuildSpaceSearchItems() {
        spaceSearchItems = [...poisData, ...nodesData].map(node => {
            const searchEntries = buildSpaceSearchEntries(node);
            return {
                node,
                id: node.id,
                isPoi: node.type === 'poi',
                searchEntries,
                searchText: searchEntries.map(entry => `${entry.text} ${entry.compactText}`).join(' ')
            };

            if (a.isPoi !== b.isPoi) return a.isPoi ? -1 : 1;
            return a.id.localeCompare(b.id);

    }

    function getPickerElements(type) {

    function selectSpace(type, nodeId) {
        const item = spaceSearchItems.find(candidate => candidate.id === nodeId);

    function resolveSelectedSpace(type) {
        const { input } = getPickerElements(type);
        if (selectedSpaceIds[type] && nodeMap[selectedSpaceIds[type]]) return selectedSpaceIds[type];

        const query = normalizeSearchText(input.value);
        const compactQuery = compactSearchText(query);
        const exactMatches = spaceSearchItems.map(item => {
            const node = item.node;
            const exactEntry = item.searchEntries.find(entry => entry.text === query || entry.compactText === compactQuery);
            const inputLabelExact = normalizeSearchText(item.id) === query || normalizeSearchText(getSpaceInputLabel(node)) === query;
            if (!exactEntry && !inputLabelExact) return null;
            const matchScore = exactEntry ? scoreSpaceSearchEntry(exactEntry, query, compactQuery) : 0;
            return { ...item, matchScore, matchEntry: exactEntry };
        }).filter(Boolean).sort(compareSpaceSearchMatches);
        const exact = exactMatches[0];
        if (exact) {
            selectedSpaceIds[type] = exact.id;
            input.value = getSpaceInputLabel(exact.node);
            return exact.id;
        }
        return '';
    }

    function renderSpaceResults(type) {
        const { input, menu } = getPickerElements(type);
        const query = normalizeSearchText(input.value);
        const maxResults = 30;
        const getMatches = item => {
            const match = getSpaceSearchMatch(item, input.value);
            if (match.score === Infinity) return null;
            return { ...item, matchScore: match.score, matchEntry: match.entry };
        };
        const poiMatches = spaceSearchItems
            .filter(item => item.isPoi)
            .map(getMatches)
            .filter(Boolean)
            .sort(compareSpaceSearchMatches)
            .slice(0, maxResults);
        const nodeMatches = query.length >= 2
            ? spaceSearchItems
                .filter(item => !item.isPoi)
                .map(getMatches)
                .filter(Boolean)
                .sort(compareSpaceSearchMatches)
                .slice(0, Math.max(0, maxResults - poiMatches.length))
            : [];
        const matches = [...poiMatches, ...nodeMatches];

        menu.innerHTML = '';
        if (matches.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'space-result-empty';
            empty.textContent = t('noSpaceResults');
            menu.appendChild(empty);
        } else {
            let currentGroup = '';
            matches.forEach(item => {
                const group = item.isPoi ? t('spaceResultPoi') : t('spaceResultNode');
                if (group !== currentGroup) {
                    currentGroup = group;
                    const groupEl = document.createElement('div');
                    groupEl.className = 'space-result-group';
                    groupEl.textContent = group;
                    menu.appendChild(groupEl);
                }

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'space-result';
                button.dataset.nodeId = item.id;
                button.innerHTML = `<span class="space-result-title"></span><span class="space-result-meta"></span>`;
                button.querySelector('.space-result-title').textContent = getSpaceDisplayName(item.node);
                button.querySelector('.space-result-meta').textContent = getSpaceResultMetaLabel(item);
                button.addEventListener('mousedown', e => {
                    e.preventDefault();
                    selectSpace(type, item.id);
                });
                menu.appendChild(button);
            });
        }
        menu.classList.add('open');
    }

    function initSpaceSearch() {
        rebuildSpaceSearchItems();
        ['start', 'end'].forEach(type => {
            const { input, menu } = getPickerElements(type);
            input.addEventListener('input', () => {
                selectedSpaceIds[type] = null;
                renderSpaceResults(type);
            });
            input.addEventListener('focus', () => renderSpaceResults(type));
            input.addEventListener('blur', () => setTimeout(() => menu.classList.remove('open'), 120));
            input.addEventListener('keydown', e => {
                if (e.key !== 'Enter') return;
                const firstResult = menu.querySelector('.space-result');
                if (firstResult) {
                    e.preventDefault();
                    selectSpace(type, firstResult.dataset.nodeId);
                }
            });
        });
    }

            const item = spaceSearchItems.find(candidate => candidate.id === selectedId);
            if (item) getPickerElements(type).input.value = getSpaceInputLabel(item.node);
        });

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function isBlankPoiValue(value) {
        if (value === null || value === undefined) return true;
        if (Array.isArray(value)) return value.filter(item => String(item || '').trim()).length === 0;
        return String(value).trim() === '';
    }

    function formatPoiValue(value) {
        if (Array.isArray(value)) return value.map(item => String(item || '').trim()).filter(Boolean).join('、');
        return String(value || '').trim();
    }

    fetch('/api/data')
        .then(res => res.json())
        .then(data => {
            nodesData = data.nodes || []; edgesData = data.edges || [];
            poisData = data.pois || []; connectionsData = data.connections || {};
            campusFeaturesData = (data.campus_features && data.campus_features.features) || [];
            campusPoisData = data.campus_pois || [];
            rebuildDerivedRouteSets();
            // 如果後端有吐出自定義 SVG 樓板邊界，則取代預設形狀
            if (data.slabs) BLDG_SHAPES = data.slabs;
            [...nodesData, ...poisData].forEach(n => { n.z = getNodeElevation(n.building, n.floor_name); nodeMap[n.id] = n; });

            ensureCommunityGraph();

    function isVerticalEdge(edge) {
        return ['stair', 'elevator'].includes(edge.type);
    }

    function normalizeColor(value) {
        return String(value || '').trim().toLowerCase();
    }

    function rebuildDerivedRouteSets() {
        verticalNodeIds = new Set();
        stairNodeIds = new Set();
        elevatorNodeIds = new Set();
        edgesData.forEach(edge => {
            if (isVerticalEdge(edge)) {
                verticalNodeIds.add(edge.from);
                verticalNodeIds.add(edge.to);
                const targetSet = edge.type === 'stair' ? stairNodeIds : elevatorNodeIds;
                targetSet.add(edge.from);
                targetSet.add(edge.to);
            }
        });
    }

    function isStairNode(node) {
        return node && stairNodeIds.has(node.id);
    }

    function isElevatorNode(node) {
        return node && elevatorNodeIds.has(node.id);
    }

    function getVerticalNodeCode(node) {
        if (!node || !node.id) return '';
        const id = String(node.id);
        const floorSuffixPattern = /-[B]?\d+(?:-\d+)?F$/i;
        let withoutFloor = id.replace(floorSuffixPattern, '');
        const building = String(node.building || '').replace(/-STACK/i, '-Stack');
        if (building && withoutFloor.toUpperCase().startsWith(`${building.toUpperCase()}-`)) {
            withoutFloor = withoutFloor.slice(building.length + 1);
        }
        const fallbackParts = withoutFloor.split('-');
        return (withoutFloor || fallbackParts[fallbackParts.length - 1] || '').trim();
    }

    function getVerticalNodeDisplayName(node) {
        if (isStairNode(node)) return t('stairNode');
        if (isElevatorNode(node)) return t('elevatorNode');
        return '';
    }

    function isBlueNode(node) {
        return normalizeColor(node.color) === '#0ea5e9' || verticalNodeIds.has(node.id);
    }

    function isCampusNode(node) {
        return node && node.scope === 'campus';
    }

    function isCampusMode() {
        return currentViewMode === 'campus_only';
    }

    function isDepartmentMode() {
        return currentViewMode === 'department_only';
    }

    function isAcademicCommunityMode() {
        return currentViewMode === 'academic_community';
    }

    function getCampusMetadataMatch(nodeOrId) {
        const id = String(nodeOrId && nodeOrId.id || nodeOrId || '').trim();
        if (!id || !campusPoisData.length) return null;
        const exact = campusPoisData.find(row => String(row.id || '').trim().toLowerCase() === id.toLowerCase());
        if (exact) return exact;
        const fallback = id.replace(/-\d+$/i, '');
        if (fallback === id) return null;
        return campusPoisData.find(row => String(row.id || '').trim().toLowerCase() === fallback.toLowerCase()) || null;
    }

    function getCampusNodeKind(node) {
        const id = String(node && node.id || '');
        if (/^CoveredPath-/i.test(id)) return 'covered_path';
        if (/^Path-/i.test(id)) return 'path';
        if (/^Building-/i.test(id)) return 'building';
        if (/^Gate-/i.test(id)) return 'gate';
        if (/^Lawn-/i.test(id)) return 'lawn';
        if (/^Pool-/i.test(id)) return 'pool';
        if (/^Court-/i.test(id)) return 'court';
        return 'campus';
    }

    function isCampusPathNode(node) {
        const kind = getCampusNodeKind(node);
        return kind === 'path' || kind === 'covered_path';
    }

    function formatCampusBuildingLabel(row, node) {
        const label = getCampusPoiLabel(row);
        if (!label) return '';
        if (currentLang !== 'zh') return label;

        const code = String(row && row.name || '')
            .trim()
            .replace(/\s+/g, '');
        if (/^[A-Z0-9]{1,4}$/i.test(code) && !label.toUpperCase().startsWith(code.toUpperCase())) {
            return `${code}${label}`;
        }

        const buildingCode = String(node && node.building || '').trim();
        if (/^[A-Z0-9]{1,4}$/i.test(buildingCode) && !label.toUpperCase().startsWith(buildingCode.toUpperCase())) {
            return `${buildingCode}${label}`;
        }
        return label;
    }

    function getCampusReadableNodeLabel(node) {
        const id = String(node && node.id || '').trim();
        const kind = getCampusNodeKind(node);
        const metadata = getCampusMetadataMatch(node);

        if (kind === 'building' && metadata) return formatCampusBuildingLabel(metadata, node);
        if (kind === 'gate' && metadata) {
            const label = getCampusPoiLabel(metadata);
            if (currentLang === 'zh' && id === 'Gate-101') return '校園大門';
            return label || (currentLang === 'zh' ? '校園出入口' : 'Campus Gate');
        }
        if (metadata) return getCampusPoiLabel(metadata);

        const labels = currentLang === 'zh'
            ? {
                covered_path: '風雨走廊',
                path: '路徑',
                gate: '校園出入口',
                lawn: '草地',
                pool: '水池',
                court: '球場',
                building: '校園建築',
                campus: '校園節點'
            }
            : {
                covered_path: 'Covered Walkway',
                path: 'Path',
                gate: 'Campus Gate',
                lawn: 'Lawn',
                pool: 'Pool',
                court: 'Court',
                building: 'Campus Building',
                campus: 'Campus Node'
            };
        return labels[kind] || id;
    }

    function isOrangeNode(node) {
        return node.type === 'poi' || normalizeColor(node.color) === '#ff9955';
    }

    const DEPARTMENT_NODE_COLORS = [
        { keys: ['設計系', 'Design'], color: '#f9a8d4' },
        { keys: ['應用外語系', '通識', 'Applied Foreign', 'General Education'], color: '#facc15' },
        { keys: ['建築系', 'Architecture'], color: '#ef4444' },
        { keys: ['資訊工程系', 'Computer Science'], color: '#60a5fa' },
        { keys: ['演講廳', 'Auditorium'], color: '#f97316' },
        { keys: ['電子計算中心', 'Computer Center'], color: '#94a3b8' },
        { keys: ['圖書館', 'Library'], color: '#fb923c' },
        { keys: ['暫不分類', 'Uncategorized'], color: '#94a3b8' }
    ];

    const DEPARTMENT_SLAB_COLORS = [
        { keys: ['設計系', 'Design'], color: 'rgba(249, 168, 212, 0.24)' },
        { keys: ['應用外語系', '通識', 'Applied Foreign', 'General Education'], color: 'rgba(250, 204, 21, 0.22)' },
        { keys: ['建築系', 'Architecture'], color: 'rgba(239, 68, 68, 0.22)' },

        { keys: ['演講廳', 'Auditorium'], color: 'rgba(249, 115, 22, 0.23)' },
        { keys: ['電子計算中心', 'Computer Center'], color: 'rgba(148, 163, 184, 0.22)' },
        { keys: ['圖書館', 'Library'], color: 'rgba(251, 146, 60, 0.23)' },
        { keys: ['暫不分類', 'Uncategorized'], color: 'rgba(203, 213, 225, 0.20)' }
    ];

    const DEPARTMENT_ATTRIBUTE_MODE_DEPARTMENTS = {
        design: ['設計系'],
        architecture: ['建築系'],
        cs: ['資訊工程系'],
        afl: ['應用外語系'],

    };

    function isDepartmentAttributeMode() {
        return isDepartmentMode() || isAcademicCommunityMode();

    function getPoiDepartmentText(node) {
        return [
            formatPoiValue(node && node.department),
            formatPoiValue(node && node.name_zh),
            formatPoiValue(node && node.name),
            formatPoiValue(node && node.category)
        ].filter(Boolean).join(' ');
    }

    function getDepartmentNodeColor(node) {
        const text = getPoiDepartmentText(node);
        if (!text) return '#94a3b8';
        const match = DEPARTMENT_NODE_COLORS.find(item => item.keys.some(key => text.includes(key)));
        return match ? match.color : '#94a3b8';
    }

    function getDepartmentSlabColorByText(text) {
        if (!text) return 'rgba(203, 213, 225, 0.20)';
        const match = DEPARTMENT_SLAB_COLORS.find(item => item.keys.some(key => text.includes(key)));
        return match ? match.color : 'rgba(203, 213, 225, 0.20)';
    }

    function getDepartmentCapsuleStyleByText(text) {
        const color = getDepartmentNodeColor({department: text});
        return {
            bgColor: getDepartmentSlabColorByText(text).replace(/0\.\d+\)/, '0.72)'),
            textColor: color === '#cbd5e1' ? '#475569' : '#0f172a'
        };
    }

    function getDominantDepartmentTextForFloor(building, floorName, allowedDepartments = null) {
        const floorPois = poisData.filter(poi =>
            poi.building === building &&
            String(poi.floor_name) === String(floorName)
        );
        const counts = new Map();
        floorPois.forEach(poi => {
            const text = formatPoiValue(poi.department) || '暫不分類';
            if (allowedDepartments && allowedDepartments.length && !allowedDepartments.some(value => text.includes(value))) return;
            counts.set(text, (counts.get(text) || 0) + 1);
        });
        let dominant = '';
        let dominantCount = 0;
        counts.forEach((count, text) => {
            if (count > dominantCount) {
                dominant = text;
                dominantCount = count;
            }
        });
        return dominant;
    }

    function getDepartmentSlabColor(slab) {
        if (slab.b === 'T4' && ['7', '8'].includes(String(slab.f))) {
            return getDepartmentSlabColorByText('應用外語系 通識');
        }
        return getDepartmentSlabColorByText(getDominantDepartmentTextForFloor(slab.b, slab.f, getDepartmentAttributeDepartments()));
    }

    function getDepartmentLabelForSlab(slab) {
        if (departmentAttributeMode === 'all') {
            return getDominantDepartmentTextForFloor(slab.b, slab.f) || '暫不分類';
        }
        if (departmentAttributeMode === 'afl' && slab.b === 'T4' && ['7', '8'].includes(String(slab.f))) return '應用外語系';
        const departments = getDepartmentAttributeDepartments();
        if (departments.length === 1) return departments[0];
        if (departments.length > 1) {
            const dominant = getDominantDepartmentTextForFloor(slab.b, slab.f, departments);
            return dominant || departments.join(' / ');
        }
        return '暫不分類';
    }

    function getDepartmentLabelForPoi(poi) {
        return formatPoiValue(poi && poi.department) || '暫不分類';
    }

    function getDepartmentAttributeDepartments() {
        return DEPARTMENT_ATTRIBUTE_MODE_DEPARTMENTS[departmentAttributeMode] || [];
    }

    function isSlabInDepartmentAttributeScope(slab) {
        if (!slab) return false;
        if (departmentAttributeMode === 'points') return false;
        if (departmentAttributeMode === 'all') return true;
        const allowedDepartments = getDepartmentAttributeDepartments();
        if (!allowedDepartments.length) return true;
        if (departmentAttributeMode === 'afl' && slab.b === 'T4' && ['7', '8'].includes(String(slab.f))) return true;
        return poisData.some(poi =>
            poi.building === slab.b &&
            String(poi.floor_name) === String(slab.f) &&
            allowedDepartments.some(value => formatPoiValue(poi.department).includes(value))
        );
    }

    function isFloorInDepartmentAttributeScope(building, floorName) {
        if (departmentAttributeMode === 'all') return true;
        if (departmentAttributeMode === 'points') return true;
        const allowedDepartments = getDepartmentAttributeDepartments();
        if (!allowedDepartments.length) return true;
        if (departmentAttributeMode === 'afl' && building === 'T4' && ['7', '8'].includes(String(floorName))) return true;
        return poisData.some(poi =>
            poi.building === building &&
            String(poi.floor_name) === String(floorName) &&
            allowedDepartments.some(value => formatPoiValue(poi.department).includes(value))
        );
    }

    function isPoiInDepartmentAttributeScope(poi) {
        if (!poi || !isOrangeNode(poi)) return false;
        if (departmentAttributeMode === 'all') return true;
        if (departmentAttributeMode === 'points') return true;
        return isFloorInDepartmentAttributeScope(poi.building, poi.floor_name);
    }

    function setDepartmentAttributeMode(mode) {
        if (!Object.prototype.hasOwnProperty.call(DEPARTMENT_ATTRIBUTE_MODE_DEPARTMENTS, mode) && !['all', 'points'].includes(mode)) return;
        if (!isDepartmentMode()) setViewMode('department_only');
        departmentAttributeMode = mode;
        document.querySelectorAll('.dept-mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.deptMode === departmentAttributeMode);
        });
        drawMap();
    }

    function normalizeCommunityText(value) {
        return String(value || '')
            .normalize('NFKC')
            .replace(/[；]/g, ';')
            .replace(/[，、]/g, ',')
            .replace(/[｜]/g, '|')
            .replace(/[　\s]+/g, ' ')
            .trim();
    }

    function getCommunityKey(value) {
        const normalized = normalizeCommunityText(value);
        if (/[\u3400-\u9fff]/.test(normalized)) return normalized.replace(/\s+/g, '');
        return normalized.toLowerCase();
    }

    function splitCommunityValues(value) {
        const rawValues = Array.isArray(value) ? value : [value];
        return rawValues
            .flatMap(raw => normalizeCommunityText(raw).split(/[;,|/]/))
            .map(item => item.trim())
            .filter(Boolean);
    }

    function makeCommunityId(prefix, label) {
        return `${prefix}::${getCommunityKey(label)}`;
    }

    function getPoiDisplayName(poi) {
        return String(poi && (poi.name_zh || poi.name_en || poi.name || poi.id) || '').trim();
    }

    function isCommunityPriorityPoi(poi) {
        const category = String(poi && poi.category || '').toLowerCase();
        const name = getPoiDisplayName(poi);
        return (
            category === 'laboratory' ||
            category === 'department_office' ||
            category === 'office' ||
            /系辦公室|中心辦公室|院辦公室|主任辦公室|老師辦公室|研究室|辦公室/i.test(name)
        );
    }

    function getCommunityNodeRadius(node) {
        if (node.kind === 'department') return 28;
        if (node.kind === 'faculty') return 17;
        if (node.category === 'department_office') return 16;
        if (node.category === 'office') return 14;
        if (node.category === 'laboratory') return 12;
        return 9;
    }

    function getCommunityDepartmentText(node) {
        if (!node) return '';
        if (node.kind === 'department') return node.label;
        if (node.departments && node.departments.size) return Array.from(node.departments)[0];
        if (node.poi) return formatPoiValue(node.poi.department);
        return '';
    }

    function getCommunityPalette(node) {
        const dept = getCommunityDepartmentText(node);
        const base = getDepartmentNodeColor({department: dept});
        if (node.kind === 'department') return { fill: base, stroke: 'rgba(15, 23, 42, 0.28)', text: '#0f172a' };
        if (node.kind === 'faculty') return { fill: base, stroke: 'rgba(15, 23, 42, 0.22)', text: '#0f172a' };
        return { fill: base, stroke: 'rgba(255, 255, 255, 0.96)', text: '#0f172a' };
    }

    function addCommunityWarning(warnings, type, detail) {
        warnings.push({type, ...detail});
    }

    function buildAcademicCommunityGraph() {
        const nodes = [];
        const edges = [];
        const nodeById = new Map();
        const warnings = [];
        const departmentRawByKey = new Map();
        const facultyRawByKey = new Map();

        function addNode(node) {
            if (nodeById.has(node.id)) return nodeById.get(node.id);
            node.departments = node.departments || new Set();
            node.r = getCommunityNodeRadius(node);
            node.vx = 0;
            node.vy = 0;
            nodeById.set(node.id, node);
            nodes.push(node);
            return node;
        }

        function rememberRaw(map, key, raw, type) {
            const previous = map.get(key);
            if (previous && previous !== raw) addCommunityWarning(warnings, `${type}_normalized_collision`, {key, values: [previous, raw]});
            if (!previous) map.set(key, raw);
        }

        function addDepartment(rawDepartment) {
            const label = normalizeCommunityText(rawDepartment);
            const key = getCommunityKey(label);
            rememberRaw(departmentRawByKey, key, label, 'department');
            const id = makeCommunityId('DEPT', label);
            return addNode({ id, kind: 'department', label, category: 'department' });
        }

        function addFaculty(rawName, sourceField) {
            const label = normalizeCommunityText(rawName);
            const key = getCommunityKey(label);
            rememberRaw(facultyRawByKey, key, label, 'faculty');
            const id = makeCommunityId('FACULTY', label);
            const node = addNode({ id, kind: 'faculty', label, category: 'faculty', sourceField });
            return node;
        }

        function addEdge(source, target, type, evidenceField, evidenceValue) {
            edges.push({
                source,
                target,
                type,
                evidence_field: evidenceField,
                evidence_value: evidenceValue
            });
        }

        poisData.forEach(poi => {
            const departments = splitCommunityValues(poi.department);
            const facultyLeads = splitCommunityValues(poi.faculty_leads);
            const occupants = splitCommunityValues(poi.occupants);
            if (departments.length > 1) addCommunityWarning(warnings, 'poi_multiple_departments', { poi_id: poi.id, value: poi.department });
            if (!departments.length && !facultyLeads.length && !occupants.length) return;

            const poiNode = addNode({
                id: poi.id,
                kind: 'poi',
                label: getPoiDisplayName(poi),
                category: poi.category || 'poi',
                poi,
                visibleDefault: isCommunityPriorityPoi(poi)
            });

            departments.forEach(department => {
                const deptNode = addDepartment(department);
                poiNode.departments.add(deptNode.label);
                addEdge(poiNode.id, deptNode.id, 'belongs_to', 'department', department);
            });

            if (String(poi.category || '').toLowerCase() === 'laboratory') {
                facultyLeads.forEach(name => {
                    const facultyNode = addFaculty(name, 'faculty_leads');
                    departments.forEach(department => facultyNode.departments.add(department));
                    addEdge(poiNode.id, facultyNode.id, 'led_by', 'faculty_leads', name);
                });
            } else if (facultyLeads.length) {
                addCommunityWarning(warnings, 'faculty_leads_on_non_laboratory_poi', { poi_id: poi.id, category: poi.category, value: facultyLeads.join('; ') });
            }

            if (String(poi.category || '').toLowerCase().includes('office')) {
                occupants.forEach(name => {
                    const facultyNode = addFaculty(name, 'occupants');
                    departments.forEach(department => facultyNode.departments.add(department));
                    addEdge(facultyNode.id, poiNode.id, 'has_office', 'occupants', name);
                });
            } else if (occupants.length) {
                addCommunityWarning(warnings, 'occupants_on_non_office_poi', { poi_id: poi.id, category: poi.category, value: occupants.join('; ') });
            }
        });

        const departmentLabels = Array.from(departmentRawByKey.values());
        if (departmentLabels.includes('資工系') && departmentLabels.includes('資訊工程系')) {
            addCommunityWarning(warnings, 'department_possible_alias_not_merged', { values: ['資工系', '資訊工程系'] });
        }

        const edgeKeys = new Set();
        const dedupedEdges = [];
        let duplicateEdges = 0;
        edges.forEach(edge => {
            const key = `${edge.source}->${edge.target}->${edge.type}->${edge.evidence_field}->${edge.evidence_value}`;
            if (edgeKeys.has(key)) {
                duplicateEdges += 1;
                return;
            }
            edgeKeys.add(key);
            dedupedEdges.push(edge);
        });
        if (duplicateEdges) addCommunityWarning(warnings, 'duplicate_edges_removed', { count: duplicateEdges });

        const adjacency = new Map(nodes.map(node => [node.id, new Set()]));
        const edgeCounts = {};
        let badEdgeRefs = 0;
        dedupedEdges.forEach(edge => {
            edgeCounts[edge.type] = (edgeCounts[edge.type] || 0) + 1;
            if (!nodeById.has(edge.source) || !nodeById.has(edge.target)) {
                badEdgeRefs += 1;
                return;
            }
            adjacency.get(edge.source).add(edge.target);
            adjacency.get(edge.target).add(edge.source);
        });
        if (badEdgeRefs) addCommunityWarning(warnings, 'edge_refs_missing_node', { count: badEdgeRefs });

        const isolatedNodes = nodes.filter(node => !(adjacency.get(node.id) && adjacency.get(node.id).size));
        if (isolatedNodes.length) addCommunityWarning(warnings, 'isolated_nodes', { count: isolatedNodes.length });

        const facultyLeadSet = new Set();
        const occupantSet = new Set();
        dedupedEdges.forEach(edge => {
            if (edge.type === 'led_by') facultyLeadSet.add(edge.target);
            if (edge.type === 'has_office') occupantSet.add(edge.source);
        });
        const onlyLead = Array.from(facultyLeadSet).filter(id => !occupantSet.has(id)).map(id => nodeById.get(id).label).sort();
        const onlyOccupant = Array.from(occupantSet).filter(id => !facultyLeadSet.has(id)).map(id => nodeById.get(id).label).sort();
        const both = Array.from(facultyLeadSet).filter(id => occupantSet.has(id)).map(id => nodeById.get(id).label).sort();

        return {
            nodes,
            edges: dedupedEdges,
            nodeById,
            adjacency,
            departments: departmentLabels.sort(),
            warnings,
            stats: {
                departmentNodes: nodes.filter(node => node.kind === 'department').length,
                facultyNodes: nodes.filter(node => node.kind === 'faculty').length,
                poiNodes: nodes.filter(node => node.kind === 'poi').length,
                edgeCounts,
                edgeTotal: dedupedEdges.length,
                warningCount: warnings.length,
                facultyOnlyLeads: onlyLead,
                facultyOnlyOccupants: onlyOccupant,
                facultyBoth: both,
                facultyWithLabNoOffice: onlyLead,
                facultyOfficeNoLab: onlyOccupant
            }
        };
    }

    function ensureCommunityGraph() {
        if (!communityGraph) {
            communityGraph = buildAcademicCommunityGraph();
            initializeCommunityLayout();
            updateCommunityControls();
        }
        return communityGraph;
    }

    function getVisibleCommunityNodes() {
        const graph = ensureCommunityGraph();
        return graph.nodes.filter(node => {
            if (!communityShowAllPois && node.kind === 'poi' && !node.visibleDefault) return false;
            if (communityDepartmentSelection === 'all') return true;
            if (node.kind === 'department') return node.label === communityDepartmentSelection;
            return node.departments && node.departments.has(communityDepartmentSelection);
        });
    }

    function getVisibleCommunityNodeIds() {
        return new Set(getVisibleCommunityNodes().map(node => node.id));
    }

    function getVisibleCommunityEdges() {
        const visibleIds = getVisibleCommunityNodeIds();
        return ensureCommunityGraph().edges.filter(edge => visibleIds.has(edge.source) && visibleIds.has(edge.target));
    }

    function initializeCommunityLayout() {
        const graph = ensureCommunityGraph();
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const deptNodes = graph.nodes.filter(node => node.kind === 'department');
        const anchors = new Map();
        const radius = Math.min(canvas.width, canvas.height) * 0.32;
        deptNodes.forEach((node, index) => {
            const angle = -Math.PI / 2 + (Math.PI * 2 * index / Math.max(1, deptNodes.length));
            const anchor = {
                x: centerX + Math.cos(angle) * radius,
                y: centerY + Math.sin(angle) * radius
            };
            anchors.set(node.label, anchor);
            node.x = anchor.x;
            node.y = anchor.y;
            node.vx = 0;
            node.vy = 0;
        });

        graph.nodes.filter(node => node.kind !== 'department').forEach((node, index) => {
            const dept = getCommunityDepartmentText(node);
            const anchor = anchors.get(dept) || {x: centerX, y: centerY};
            const angle = index * 2.3999632297;
            const spread = node.kind === 'faculty' ? 76 : 128;
            node.x = anchor.x + Math.cos(angle) * spread + ((index % 5) - 2) * 8;
            node.y = anchor.y + Math.sin(angle) * spread + ((index % 7) - 3) * 8;
            node.vx = 0;
            node.vy = 0;
        });

        graph.departmentAnchors = anchors;
        communityIterations = 0;
    }

    function resetCommunityLayout() {
        ensureCommunityGraph();
        initializeCommunityLayout();
        communitySelectedNodeId = null;
        startCommunitySimulation(true);
        drawMap();
    }

    function communityToScreen(node) {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        return {
            x: cx + (node.x - cx) * communityViewport.zoom + communityViewport.offsetX,
            y: cy + (node.y - cy) * communityViewport.zoom + communityViewport.offsetY
        };
    }

    function findCommunityNodeAt(x, y) {
        const nodes = getVisibleCommunityNodes().slice().sort((a, b) => b.r - a.r);
        for (const node of nodes) {
            const p = communityToScreen(node);
            const radius = (node.r + 6) * communityViewport.zoom;
            if (Math.hypot(p.x - x, p.y - y) <= radius) return node;
        }
        return null;
    }

    function isCommunityNodeHighlighted(node) {
        if (!communitySelectedNodeId) return true;
        if (node.id === communitySelectedNodeId) return true;
        const neighbors = ensureCommunityGraph().adjacency.get(communitySelectedNodeId);
        return neighbors && neighbors.has(node.id);
    }

    function isCommunityEdgeHighlighted(edge) {
        if (!communitySelectedNodeId) return true;
        return edge.source === communitySelectedNodeId || edge.target === communitySelectedNodeId;
    }

    function getCommunityLinkDistance(edge) {
        if (edge.type === 'belongs_to') return 125;
        if (edge.type === 'led_by') return 95;
        return 82;
    }

    function tickCommunityLayout() {
        const graph = ensureCommunityGraph();
        const nodes = getVisibleCommunityNodes();
        const nodeIds = new Set(nodes.map(node => node.id));
        const edges = graph.edges.filter(edge => nodeIds.has(edge.source) && nodeIds.has(edge.target));
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const damping = 0.82;

        nodes.forEach(node => {
            node.vx *= damping;
            node.vy *= damping;
            const dept = getCommunityDepartmentText(node);
            const anchor = graph.departmentAnchors && graph.departmentAnchors.get(dept);
            if (node.kind === 'department' && anchor) {
                node.vx += (anchor.x - node.x) * 0.025;
                node.vy += (anchor.y - node.y) * 0.025;
            } else if (anchor) {
                node.vx += (anchor.x - node.x) * 0.0026;
                node.vy += (anchor.y - node.y) * 0.0026;
            } else {
                node.vx += (centerX - node.x) * 0.0015;
                node.vy += (centerY - node.y) * 0.0015;
            }
        });

        edges.forEach(edge => {
            const source = graph.nodeById.get(edge.source);
            const target = graph.nodeById.get(edge.target);
            if (!source || !target) return;
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const desired = getCommunityLinkDistance(edge);
            const force = (distance - desired) * 0.012;
            const fx = dx / distance * force;
            const fy = dy / distance * force;
            source.vx += fx;
            source.vy += fy;
            target.vx -= fx;
            target.vy -= fy;
        });

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const a = nodes[i], b = nodes[j];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const distance = Math.max(1, Math.hypot(dx, dy));
                const minDistance = a.r + b.r + 18;
                const charge = Math.min(3.2, 280 / (distance * distance));
                const rx = dx / distance * charge;
                const ry = dy / distance * charge;
                a.vx -= rx;
                a.vy -= ry;
                b.vx += rx;
                b.vy += ry;
                if (distance < minDistance) {
                    const push = (minDistance - distance) * 0.035;
                    const px = dx / distance * push;
                    const py = dy / distance * push;
                    a.vx -= px;
                    a.vy -= py;
                    b.vx += px;
                    b.vy += py;
                }
            }
        }

        let totalVelocity = 0;
        nodes.forEach(node => {
            node.x += Math.max(-7, Math.min(7, node.vx));
            node.y += Math.max(-7, Math.min(7, node.vy));
            node.x = Math.max(80, Math.min(canvas.width - 80, node.x));
            node.y = Math.max(70, Math.min(canvas.height - 70, node.y));
            totalVelocity += Math.abs(node.vx) + Math.abs(node.vy);
        });

        communityIterations += 1;
        return totalVelocity / Math.max(1, nodes.length);
    }

    function startCommunitySimulation(forceRestart = false) {
        if (!isAcademicCommunityMode()) return;
        if (forceRestart) stopCommunitySimulation();
        if (communityAnimationFrame) return;
        const step = () => {
            if (!isAcademicCommunityMode()) {
                stopCommunitySimulation();
                return;
            }
            const avgVelocity = tickCommunityLayout();
            drawMap();
            if (communityIterations < COMMUNITY_MAX_ITERATIONS && avgVelocity > 0.012) {
                communityAnimationFrame = requestAnimationFrame(step);
            } else {
                communityAnimationFrame = null;
            }
        };
        communityAnimationFrame = requestAnimationFrame(step);
    }

    function stopCommunitySimulation() {
        if (communityAnimationFrame) {
            cancelAnimationFrame(communityAnimationFrame);
            communityAnimationFrame = null;
        }
    }

    function updateCommunityControls() {
        if (!academicCommunityControls) return;
        const isOpen = ACADEMIC_COMMUNITY_BETA && isAcademicCommunityMode();
        academicCommunityControls.classList.toggle('open', isOpen);
        if (!communityGraph || !communityDepartmentFilter) return;
        const previous = communityDepartmentFilter.value || communityDepartmentSelection;
        communityDepartmentFilter.innerHTML = '';
        communityDepartmentFilter.add(new Option(t('communityFilterAll'), 'all'));
        communityGraph.departments.forEach(department => {
            communityDepartmentFilter.add(new Option(department, department));
        });
        communityDepartmentFilter.value = communityGraph.departments.includes(previous) ? previous : 'all';
        communityDepartmentSelection = communityDepartmentFilter.value;
        if (communityShowAllPoisInput) communityShowAllPoisInput.checked = communityShowAllPois;
        if (communitySummary) {
            const visibleNodeCount = getVisibleCommunityNodes().length;
            const visibleEdgeCount = getVisibleCommunityEdges().length;
            communitySummary.textContent = `Nodes ${visibleNodeCount}/${communityGraph.nodes.length} · Edges ${visibleEdgeCount}/${communityGraph.edges.length} · Warnings ${communityGraph.warnings.length}`;
        }
    }

    function getCommunityEdgeStyle(type) {
        if (type === 'led_by') return { color: 'rgba(100, 116, 139, 0.42)', width: 1.4, dash: [8, 6] };
        if (type === 'has_office') return { color: 'rgba(100, 116, 139, 0.34)', width: 1.1, dash: [2, 5] };
        return { color: 'rgba(100, 116, 139, 0.34)', width: 1.2, dash: [] };
    }

    function drawCommunityView() {
        const graph = ensureCommunityGraph();
        const nodes = getVisibleCommunityNodes();
        const visibleIds = new Set(nodes.map(node => node.id));
        const edges = graph.edges.filter(edge => visibleIds.has(edge.source) && visibleIds.has(edge.target));

        ctx.save();
        ctx.fillStyle = '#f8fbfa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        edges.forEach(edge => {
            const source = graph.nodeById.get(edge.source);
            const target = graph.nodeById.get(edge.target);
            if (!source || !target) return;
            const p1 = communityToScreen(source);
            const p2 = communityToScreen(target);
            const style = getCommunityEdgeStyle(edge.type);
            ctx.globalAlpha = isCommunityEdgeHighlighted(edge) ? 1 : 0.14;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = style.color;
            ctx.lineWidth = style.width * communityViewport.zoom;
            ctx.setLineDash(style.dash.map(value => value * communityViewport.zoom));
            ctx.stroke();
        });
        ctx.setLineDash([]);

        nodes.forEach(node => {
            const p = communityToScreen(node);
            const palette = getCommunityPalette(node);
            const highlighted = isCommunityNodeHighlighted(node);
            const hovered = node.id === communityHoveredNodeId;
            const selected = node.id === communitySelectedNodeId;
            ctx.globalAlpha = highlighted ? 1 : 0.18;
            ctx.beginPath();
            ctx.arc(p.x, p.y, node.r * communityViewport.zoom, 0, Math.PI * 2);
            ctx.fillStyle = palette.fill;
            ctx.fill();
            ctx.strokeStyle = selected ? '#0f172a' : (hovered ? '#334155' : palette.stroke);
            ctx.lineWidth = (selected ? 3 : hovered ? 2.4 : 1.4) * communityViewport.zoom;
            ctx.stroke();

            const shouldLabel = node.kind === 'department' || selected || hovered || (communityViewport.zoom > 1.55 && node.kind === 'faculty');
            if (shouldLabel) {
                ctx.globalAlpha = highlighted ? 1 : 0.24;
                ctx.font = `${node.kind === 'department' ? 850 : 760} ${Math.max(11, (node.kind === 'department' ? 14 : 11) * communityViewport.zoom)}px 'Segoe UI', Arial`;
                ctx.fillStyle = palette.text;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(node.label, p.x, p.y + (node.r + 5) * communityViewport.zoom);
            }
        });

        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(71, 85, 105, 0.72)';
        ctx.font = "800 13px 'Segoe UI', Arial";
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('Academic Community View · Beta', 24, 22);
        ctx.restore();
    }

    function getCommunityNodeTypeLabel(node) {
        if (node.kind === 'department') return 'Department';
        if (node.kind === 'faculty') return 'Faculty';
        return 'POI';
    }

    function renderCommunityHoverTooltip(node, event) {
        document.getElementById('tt-name').innerText = node.label;
        const poi = node.poi || {};
        const rows = [
            buildTooltipRow('communityNodeType', getCommunityNodeTypeLabel(node)),
            buildTooltipRow('communityNodeDepartment', getCommunityDepartmentText(node)),
            buildTooltipRow('communityNodeCategory', node.category),
            node.kind === 'poi' ? buildTooltipRow('communityNodeLocation', getPoiLocationLabel(poi)) : '',
            node.kind === 'poi' ? buildTooltipRow('communityNodeFacultyLeads', poi.faculty_leads) : '',
            node.kind === 'poi' ? buildTooltipRow('communityNodeOccupants', poi.occupants) : ''
        ];
        hoverTooltipMeta.innerHTML = rows.join('');

    function renderCommunitySelectionInfo(node) {
        if (!node) {
            setInfoBox(() => t('infoInitial'));
            return;
        }
        const graph = ensureCommunityGraph();
        const neighbors = graph.adjacency.get(node.id) || new Set();
        const relatedEdges = graph.edges.filter(edge => edge.source === node.id || edge.target === node.id);
        setInfoBox(() => {
            const lines = [
                `<b>${escapeHtml(node.label)}</b>`,
                `${escapeHtml(t('communityNodeType'))}<b>${escapeHtml(getCommunityNodeTypeLabel(node))}</b>`
            ];
            const dept = getCommunityDepartmentText(node);
            if (dept) lines.push(`${escapeHtml(t('communityNodeDepartment'))}<b>${escapeHtml(dept)}</b>`);
            if (node.kind === 'poi') {
                const poi = node.poi || {};
                if (poi.category) lines.push(`${escapeHtml(t('communityNodeCategory'))}<b>${escapeHtml(poi.category)}</b>`);
                const location = getPoiLocationLabel(poi);
                if (location) lines.push(`${escapeHtml(t('communityNodeLocation'))}<b>${escapeHtml(location)}</b>`);
                if (!isBlankPoiValue(poi.faculty_leads)) lines.push(`${escapeHtml(t('communityNodeFacultyLeads'))}<b>${escapeHtml(formatPoiValue(poi.faculty_leads))}</b>`);
                if (!isBlankPoiValue(poi.occupants)) lines.push(`${escapeHtml(t('communityNodeOccupants'))}<b>${escapeHtml(formatPoiValue(poi.occupants))}</b>`);
            }
            lines.push(`Neighbors: <b>${neighbors.size}</b>`);
            lines.push(`Edges: <b>${relatedEdges.length}</b>`);
            return lines.join('\n');
        });
    }

    function isPointSelectNode(node) {
        return isOrangeNode(node) || isBlueNode(node);
    }

    function isVerticalNode(node) {
        return isBlueNode(node);
    }

    function isRouteNode(node) {
        return currentPath.includes(node.id) || altPath.includes(node.id) || node.id === tempStart || node.id === tempEnd;
    }

    function pathHasEdge(path, edgeKey) {
        for (let i = 0; i < path.length - 1; i++) {
            if (getEdgeKey(path[i], path[i + 1]) === edgeKey) return true;
        }
        return false;
    }

    function isEdgeOnRoute(edge) {
        const key = getEdgeKey(edge.from, edge.to);
        return pathHasEdge(currentPath, key) || pathHasEdge(altPath, key);
    }

    function isNodeDrawableForMode(node) {
        if (isCampusMode()) {
            if (!isCampusNode(node)) return false;
            if (isCampusPathNode(node)) return isRouteNode(node);
            return true;
        }
        if (isCampusNode(node)) return false;
        if (isDepartmentMode()) return isRouteNode(node) || isPoiInDepartmentAttributeScope(node);
        if (isRouteNode(node)) return true;
        if (currentViewMode === 'vertical_only') return isVerticalNode(node);
        if (currentViewMode === 'point_select') return isPointSelectNode(node);
        return true;
    }

    function isEdgeDrawableForMode(edge, n1, n2) {
        const isCampusEdge = isCampusNode(n1) && isCampusNode(n2);
        if (isCampusMode()) return isCampusEdge && isEdgeOnRoute(edge);
        if (isDepartmentMode()) return !isCampusEdge && isEdgeOnRoute(edge);
        return !isCampusNode(n1) && !isCampusNode(n2);
    }

    function formatNodeMeta(node) {
        return [
            node.scope,
            node.building,
            node.floor_name ? formatFloorLabel(node.floor_name) : ''
        ].filter(value => !isBlankPoiValue(value)).join(' / ');
    }

    function getEdgeKey(source, target) {
        return [String(source), String(target)].sort().join('::');
    }

    function getCampusEdgeColor(type) {
        return CAMPUS_EDGE_TYPE_COLORS[type] || 'rgba(47, 125, 104, 0.92)';
    }

    function getRoutingNodeIds() {
        return new Set(nodesData.map(node => node.id));
    }

    function getExistingEdgeKeys() {
        const keys = new Set();
        edgesData.forEach(edge => {
            if (edge && edge.from && edge.to) keys.add(getEdgeKey(edge.from, edge.to));
        });
        draftEdges.forEach(edge => keys.add(getEdgeKey(edge[0], edge[1])));
        return keys;
    }

    function validateDraftEdge(sourceId, targetId, edgeType, options = {}) {
        const nodeIds = getRoutingNodeIds();
        if (!edgeType) return { ok: false, messageKey: 'edgeStatusNeedType' };
        if (!options.allowUnknownType && !CAMPUS_EDGE_TYPES.includes(edgeType)) return { ok: false, messageKey: 'edgeStatusInvalidType' };
        if (!nodeIds.has(sourceId) || !nodeIds.has(targetId)) return { ok: false, messageKey: 'edgeStatusMissingNode' };
        if (sourceId === targetId) return { ok: false, messageKey: 'edgeStatusSelfLoop' };
        const existingKeys = options.skipDraft ? new Set(edgesData.map(edge => getEdgeKey(edge.from, edge.to))) : getExistingEdgeKeys();
        if (existingKeys.has(getEdgeKey(sourceId, targetId))) return { ok: false, messageKey: 'edgeStatusDuplicate' };
        return { ok: true };
    }

    function handleEdgeEditorNodeClick(node) {
        if (!edgeEditorEnabled) return false;
        if (!node) {
            setEdgeEditorStatus('edgeStatusMissingNode');
            return true;
        }
        const edgeType = edgeTypeSelect.value;
        if (!edgeType) {
            setEdgeEditorStatus('edgeStatusNeedType');
            return true;
        }
        if (!edgeEditorSourceId) {
            edgeEditorSourceId = node.id;
            setEdgeEditorStatus('edgeStatusReady');
            drawMap();
            return true;
        }
        const result = validateDraftEdge(edgeEditorSourceId, node.id, edgeType);
        if (!result.ok) {
            setEdgeEditorStatus(result.messageKey);
            drawMap();
            return true;
        }
        draftEdges.push([edgeEditorSourceId, node.id, edgeType]);
        const source = edgeEditorSourceId;
        edgeEditorSourceId = null;
        setEdgeEditorStatus('edgeStatusCreated', { source, target: node.id });
        drawMap();
        return true;
    }

        edgeEditorSourceId = null;

    function undoLastDraftEdge() {
        if (!draftEdges.length) {
            setEdgeEditorStatus('edgeStatusNothingUndo');
            return;
        }
        draftEdges.pop();
        setEdgeEditorStatus('edgeStatusUndo');

    function clearDraftEdges() {
        if (!draftEdges.length) {
            setEdgeEditorStatus('edgeStatusCleared');
            return;
        }
        if (!window.confirm(t('edgeConfirmClear'))) return;
        draftEdges = [];
